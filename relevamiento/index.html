<style>
  :root{
    --bg:#E3E2DA; --card:#FFFFFF; --ink:#1C2B3A; --heading:#003478; --muted:#5B6B80;
    --line:#CFCDC2; --accent:#FF0054; --accent-soft:#FFE3EC; --navy:#003478;
    --panel:#F4F3EE; --field-line:#B9C4D4; --ok:#237A3F; --ok-bg:#E4F4E9;
    --warn:#8A5A00; --warn-bg:#FBF0DA; --ease:cubic-bezier(.23,1,.32,1);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#081426; --card:#0F2440; --ink:#E9EEF6; --heading:#BBD0EE; --muted:#9FB0C7;
      --line:#243C5E; --accent:#FF4D80; --accent-soft:#3A1128; --navy:#1E4A85;
      --panel:#0B1D37; --field-line:#31517D; --ok:#6FD08C; --ok-bg:#0E3320;
      --warn:#EFC26A; --warn-bg:#3A2B0A;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;font-size:16px;line-height:1.5}
  h1,h2,h3{font-family:Montserrat,"Trebuchet MS",sans-serif;color:var(--heading);margin:0;text-wrap:balance}
  .hero{background:linear-gradient(150deg,#003478 0%,#00234F 70%,#001A3C 100%);color:#fff;padding:30px 20px 36px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.10) 1px,transparent 1.6px);background-size:26px 26px;pointer-events:none}
  .hero-inner{max-width:820px;margin:0 auto;position:relative;z-index:1}
  .lockup{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .lockup .mbc-logo{height:22px;width:auto;display:block}
  .lockup .sep{width:1px;height:26px;background:rgba(255,255,255,.28)}
  .lockup .tool{font-family:Montserrat,sans-serif;font-weight:700;font-size:15px}
  .eyebrow{font-family:Montserrat,sans-serif;font-size:13px;font-weight:600;color:#9FC1F2;margin:0 0 8px}
  .hero h1{color:#fff;font-size:clamp(24px,5vw,32px);font-weight:800;line-height:1.15}
  .hero p{max-width:46em;font-size:15.5px;color:#D7E3F5;margin:12px 0 0}
  .wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px;display:flex;flex-direction:column;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
  .card.destacado{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .card h2{font-size:19px;margin-bottom:6px}
  .lead{color:var(--muted);margin:0 0 14px;font-size:15px}
  .aviso{background:var(--panel);border-left:3px solid var(--navy);border-radius:0 10px 10px 0;padding:12px 16px;font-size:14px;color:var(--ink);margin:0}
  .aviso strong{color:var(--heading)}
  .paso{display:flex;gap:12px;align-items:baseline}
  .paso .n{font-family:Montserrat,sans-serif;font-weight:800;font-size:22px;color:var(--accent);min-width:26px}
  .paso > div{flex:1;min-width:0}
  label{display:block;font-family:Montserrat,sans-serif;font-weight:600;font-size:13px;color:var(--heading);margin:12px 0 5px}
  input[type=text],input[type=email],input[type=search],textarea,select{width:100%;background:var(--card);color:var(--ink);border:1.5px solid var(--field-line);border-radius:10px;padding:10px 12px;font:inherit}
  textarea{min-height:110px;resize:vertical}
  input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  @media (max-width:600px){ .grid2{grid-template-columns:1fr} }
  .fila{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .btn{appearance:none;cursor:pointer;font-family:Montserrat,sans-serif;font-weight:700;border-radius:11px;padding:12px 22px;font-size:14.5px;border:1.5px solid transparent;background:var(--accent);color:#fff;transition:transform 140ms var(--ease),filter 140ms ease}
  a.btn{display:inline-block;text-decoration:none}
  .btn:hover{filter:brightness(1.07)} .btn:active{transform:scale(.97)}
  .btn[disabled]{opacity:.55;cursor:not-allowed;filter:none;transform:none}
  .btn-ghost{background:none;border-color:var(--field-line);color:var(--heading)}
  .btn-sm{padding:9px 15px;font-size:13.5px;border-radius:9px}
  .btn-rec{background:var(--navy)}
  .btn-ico{display:inline-flex;align-items:center;gap:8px}
  .btn-link{appearance:none;background:none;border:none;cursor:pointer;color:var(--accent);font:inherit;font-size:14px;text-decoration:underline;padding:2px}
  .pillbox{display:flex;flex-wrap:wrap;gap:8px}
  .pill{position:relative;cursor:pointer}
  .pill input{position:absolute;opacity:0;pointer-events:none}
  .pill span{display:inline-block;border:1.5px solid var(--field-line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px;line-height:1.2}
  .pill input:checked + span{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
  .pill input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
  .sub-t{font-family:Montserrat,sans-serif;font-weight:700;font-size:14px;color:var(--heading);margin:22px 0 2px}
  .proc-rev{border-top:1px solid var(--line);padding:14px 0}
  .proc-rev:first-child{border-top:none}
  .proc-nombre{font-family:Montserrat,sans-serif;font-weight:700;color:var(--heading);font-size:15.5px}
  .proc-ruta{color:var(--muted);font-size:13px;margin:2px 0 10px}
  .tag{display:inline-block;font-family:Montserrat,sans-serif;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;margin-left:6px;vertical-align:middle;background:var(--accent-soft);color:var(--accent)}
  .lista-el{list-style:none;margin:0;padding:0}
  .lista-el li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
  .lista-el li:first-child{border-top:none}
  .lista-el li .txt{flex:1;min-width:0}
  .lista-el li .proc-ruta{margin-bottom:0}
  .lista-el li.vacio{color:var(--muted);font-size:14px;display:block}
  /* Buscador (combobox) */
  .bus-caja{position:relative}
  .bus-lupa{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  input.bus-input{padding:13px 14px 13px 42px;font-size:16px}
  .bus-estado{font-size:13px;color:var(--muted);margin:6px 0 0;min-height:1.3em}
  .bus-lista{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--card);max-height:420px;overflow-y:auto}
  .bus-op{padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;display:flex;gap:12px;align-items:center}
  .bus-op:first-child{border-top:none}
  .bus-op:hover,.bus-op[aria-selected=true]{background:var(--panel)}
  .bus-op .txt{flex:1;min-width:0}
  .bus-nombre{font-family:Montserrat,sans-serif;font-weight:700;color:var(--heading);font-size:15px}
  .bus-ruta{color:var(--muted);font-size:12.5px;margin-top:2px}
  .bus-accion{flex:none;font-family:Montserrat,sans-serif;font-weight:700;font-size:13px;color:var(--accent)}
  .bus-op.ya{cursor:default}
  .bus-op.ya .bus-accion{color:var(--ok)}
  .bus-pie{padding:11px 14px;border-top:1px solid var(--line);background:var(--panel);font-size:14px}
  mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
  .enlace-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .enlace-box input{flex:1;min-width:220px;font-size:13px;padding:8px 10px}
  details.proc{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  details.proc > summary{list-style:none;cursor:pointer;padding:18px 20px;display:flex;align-items:center;gap:14px}
  details.proc > summary::-webkit-details-marker{display:none}
  details.proc[open] > summary{border-bottom:1px solid var(--line)}
  .sum-txt{flex:1;min-width:0}
  .avance{font-family:Montserrat,sans-serif;font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .avance.full{color:var(--ok)}
  .chev{flex:none;transition:transform 180ms var(--ease);color:var(--muted)}
  details.proc[open] .chev{transform:rotate(180deg)}
  .preg{padding:18px 20px;border-top:1px solid var(--line)}
  .preg:first-child{border-top:none}
  .preg-t{font-family:Montserrat,sans-serif;font-weight:700;color:var(--heading);font-size:15px;display:flex;gap:10px}
  .preg-t .qn{flex:none;width:26px;height:26px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-content:center;font-size:13px}
  .preg-g{color:var(--muted);font-size:13.5px;margin:4px 0 12px 36px}
  @media (max-width:560px){ .preg-g{margin-left:0} }
  .rec-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .rec-timer{font-family:Montserrat,sans-serif;font-weight:700;font-size:18px;color:var(--heading);font-variant-numeric:tabular-nums;min-width:48px}
  .rec-dot{width:11px;height:11px;border-radius:50%;background:var(--accent);animation:blink 1s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion: reduce){ .rec-dot{animation:none} .chev,.btn{transition:none} }
  .estado{font-size:13px;color:var(--muted);min-height:1.4em}
  .estado.ok{color:var(--ok)} .estado.warn{color:var(--warn)}
  .sis-t{font-family:Montserrat,sans-serif;font-size:12.5px;font-weight:700;color:var(--muted);margin:12px 0 8px}
  .barra{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
  .barra-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:14px}
  .pbar{flex:1;height:8px;border-radius:99px;background:var(--panel);overflow:hidden}
  .pbar div{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s ease}
  .ptext{font-family:Montserrat,sans-serif;font-size:12.5px;font-weight:700;color:var(--heading);white-space:nowrap;font-variant-numeric:tabular-nums}
  .msg{border-radius:12px;padding:12px 16px}
  .msg.warn{background:var(--warn-bg);color:var(--warn)} .msg.ok{background:var(--ok-bg);color:var(--ok)}
  .foot{background:linear-gradient(150deg,#003478,#00234F);color:#C6D6EC;padding:22px 16px}
  .foot-inner{max-width:820px;margin:0 auto;font-size:12.5px}
  .hidden{display:none !important}
</style>
</head>

<script>
'use strict';
(function(){
  var API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://127.0.0.1:8787' : 'https://voz-relevamiento-api.minsait-business-consulting-pe.workers.dev';
  var TRAMO_SEG = 120;          // el audio se envía en tramos de 2 minutos (16 kHz, mono)
  var MAX_SEG = 600;            // hasta 10 minutos por grabación
  var PREGUNTAS = [
    {id:'q1', t:'¿Para qué existe este proceso? ¿Qué lo inicia y dónde termina?', g:'Cuéntanos el objetivo, qué evento lo dispara y a quién le entregas el resultado (otra área, un cliente, un tercero).'},
    {id:'q2', t:'¿Cómo se hace, paso a paso?', g:'Describe las actividades principales en orden, quién las hace y qué otras áreas participan.'},
    {id:'q3', t:'¿Qué sistemas y herramientas usan? ¿Qué se hace a mano?', g:'Menciona el nombre exacto de cada sistema, portal, Excel o aplicativo, para qué lo usan y en qué paso. Cuéntanos qué partes son manuales y cuáles automáticas.', sistemas:true},
    {id:'q4', t:'¿Con qué terceros interactúan?', g:'Proveedores, concesionarios, clientes, entidades del Estado u otros: para qué, y si es por un sistema, correo o de forma presencial.'},
    {id:'q5', t:'¿Se manejan datos de personas en este proceso?', g:'De quiénes (clientes, trabajadores, proveedores), qué tipo de datos (identificación, contacto, financieros…) y en qué sistemas o archivos se guardan. No menciones datos reales de nadie.'},
    {id:'q6', t:'¿Cómo saben si va bien, qué lo regula y cada cuánto ocurre?', g:'Indicadores que usan, normas o políticas que aplican, y la frecuencia o volumen aproximado.'}
  ];
  // Relación de la persona con un proceso de su sección que viene del inventario.
  var ESTADOS = [['vigente','Participo'], ['cambio','Participo, pero cambió'], ['no_participo','Existe, no participo'], ['no_existe','Ya no se hace']];

  var $ = function(s){ return document.querySelector(s); };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmt(s){ return Math.floor(s/60)+':'+('0'+Math.floor(s%60)).slice(-2); }
  function sinTildes(s){ return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  var VACIAS = ['de','del','la','las','el','los','y','e','en','a','al','para','por','con','un','una','o'];
  function terminos(q){
    var t = sinTildes(q).split(/\s+/).filter(Boolean);
    if (t.length > 1) t = t.filter(function(x){ return VACIAS.indexOf(x) < 0; });
    return t;
  }
  // Marca las palabras buscadas sin importar tildes ni mayúsculas.
  function resaltar(texto, q){
    texto = String(texto == null ? '' : texto);
    var n = sinTildes(texto);
    if (n.length !== texto.length) return esc(texto);
    var marca = [], i, k;
    for (i = 0; i < texto.length; i++) marca.push(false);
    terminos(q).forEach(function(t){
      var p = n.indexOf(t);
      while (p >= 0){ for (var j = p; j < p + t.length; j++) marca[j] = true; p = n.indexOf(t, p + t.length); }
    });
    var out = '', abierto = false;
    for (k = 0; k < texto.length; k++){
      if (marca[k] && !abierto){ out += '<mark>'; abierto = true; }
      if (!marca[k] && abierto){ out += '</mark>'; abierto = false; }
      out += esc(texto[k]);
    }
    return out + (abierto ? '</mark>' : '');
  }

  var params = new URLSearchParams(location.search);
  var K = params.get('k') || '';
  var C = params.get('c') || '';
  var G = params.get('g') || '';
  var S = null;   // sesión personal: {campana, encuestado, procesos, revisiones, respuestas, sistemas}
  var A = null;   // enlace abierto: {campana, dominio, areas}

  function api(path, body){
    var opt = body ? {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(Object.assign({k:K}, body))} : {};
    // Sin conexión con el servidor (red corporativa que lo bloquea, sin internet): un mensaje que la persona pueda resolver.
    return fetch(API + path, opt).catch(function(){
      throw new Error('No pudimos conectarnos con el servidor de la encuesta. Si estás en la red de tu empresa, ábrela desde tu celular con datos móviles, o avisa al equipo consultor.');
    }).then(function(r){
      return r.json().catch(function(){ return {ok:false, error:'Respuesta inesperada del servidor'}; }).then(function(j){
        if (!r.ok || !j.ok) throw new Error(j.error || ('Error ' + r.status));
        return j;
      });
    });
  }

  function errorGeneral(t){
    var e = $('#errorGeneral');
    if (!e){   // la vista pudo reemplazar el contenedor original
      e = document.createElement('div');
      e.id = 'errorGeneral'; e.className = 'msg warn'; e.setAttribute('role', 'alert');
      $('#root').insertBefore(e, $('#root').firstChild);
    }
    e.textContent = t; e.classList.remove('hidden');
  }
  function nombreProc(p){ return p.subproceso || p.proceso || p.macroproceso; }
  function rutaProc(p){ return [p.macroproceso, p.proceso, p.subproceso].filter(Boolean).filter(function(x){ return x !== nombreProc(p); }).join(' › '); }
  function areaProc(p){ return [p.gerencia, p.seccion].filter(Boolean).join(' · '); }

  // ------------------------------------------------------------ buscador de procesos
  // Patrón combobox: escribes, las flechas recorren la lista y Enter elige.
  var nBus = 0;
  function crearBuscador(o){
    var id = 'bus' + (++nBus);
    var el = document.createElement('div');
    el.innerHTML =
      '<label for="' + id + '">' + esc(o.etiqueta) + '</label>' +
      '<div class="bus-caja"><svg class="bus-lupa" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>' +
      '<input type="search" class="bus-input" id="' + id + '" role="combobox" aria-expanded="false" aria-controls="' + id + '-l" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="' + esc(o.placeholder) + '"></div>' +
      '<p class="bus-estado" aria-live="polite"></p>' +
      '<ul class="bus-lista hidden" id="' + id + '-l" role="listbox" aria-label="Procesos encontrados"></ul>';
    var input = el.querySelector('input'), lista = el.querySelector('ul'), estadoEl = el.querySelector('.bus-estado');
    var items = [], activo = -1, seq = 0, timer = null, ultimo = '';

    function cerrar(){ lista.classList.add('hidden'); input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant'); activo = -1; }
    function abrir(){ lista.classList.remove('hidden'); input.setAttribute('aria-expanded', 'true'); }
    function mover(d){
      var ops = lista.querySelectorAll('[role=option]');
      if (!ops.length) return;
      activo = (activo + d + ops.length) % ops.length;
      Array.prototype.forEach.call(ops, function(op, i){ op.setAttribute('aria-selected', i === activo ? 'true' : 'false'); });
      input.setAttribute('aria-activedescendant', ops[activo].id);
      ops[activo].scrollIntoView({block:'nearest'});
    }
    function correr(){
      var q = input.value.trim();
      ultimo = q;
      if (sinTildes(q).replace(/\s/g, '').length < 2){ cerrar(); estadoEl.textContent = q ? 'Escribe al menos 2 letras.' : ''; return; }
      var mio = ++seq;
      estadoEl.textContent = 'Buscando…';
      o.buscar(q).then(function(j){
        if (mio !== seq) return;
        items = j.resultados || [];
        pintar(q, j.total || 0);
      }).catch(function(err){ if (mio === seq) estadoEl.textContent = err.message; });
    }
    function pintar(q, total){
      lista.innerHTML = '';
      activo = -1;
      items.forEach(function(p, i){
        var ya = o.yaElegido(p);
        var li = document.createElement('li');
        li.className = 'bus-op' + (ya ? ' ya' : '');
        li.id = id + '-o' + i;
        li.setAttribute('role', 'option');
        li.setAttribute('aria-selected', 'false');
        if (ya) li.setAttribute('aria-disabled', 'true');
        var ruta = [areaProc(p), rutaProc(p)].filter(Boolean).join(' › ');
        li.innerHTML = '<div class="txt"><div class="bus-nombre">' + resaltar(nombreProc(p), q) + (p.nuevo ? '<span class="tag">Agregado en la encuesta</span>' : '') + '</div>' +
          '<div class="bus-ruta">' + resaltar(ruta, q) + (p.codigo ? ' · ' + resaltar(p.codigo, q) : '') + '</div></div>' +
          '<span class="bus-accion">' + (ya ? '✓ Ya está en tu lista' : 'Elegir') + '</span>';
        li.addEventListener('mousedown', function(ev){ ev.preventDefault(); });   // el campo no pierde el foco
        li.addEventListener('click', function(){ elegir(i); });
        lista.appendChild(li);
      });
      if (o.agregar){
        var pie = document.createElement('li');
        pie.className = 'bus-pie';
        pie.innerHTML = (items.length ? '¿No es ninguno de estos? ' : 'No encontramos «' + esc(q) + '» en el inventario. ') +
          '<button type="button" class="btn-link">' + esc(o.textoAgregar) + '</button>';
        pie.addEventListener('mousedown', function(ev){ ev.preventDefault(); });
        pie.querySelector('button').addEventListener('click', function(){ cerrar(); o.agregar(q); });
        lista.appendChild(pie);
      }
      estadoEl.textContent = !total ? 'Sin coincidencias.' :
        total > items.length ? 'Mostrando ' + items.length + ' de ' + total + '. Escribe más letras para afinar.' :
        total + (total === 1 ? ' proceso encontrado.' : ' procesos encontrados.');
      abrir();
    }
    function elegir(i){
      var p = items[i];
      if (!p || o.yaElegido(p)) return;
      var li = document.getElementById(id + '-o' + i);
      if (li) li.querySelector('.bus-accion').textContent = 'Agregando…';
      Promise.resolve(o.elegir(p)).then(function(){
        estadoEl.textContent = 'Agregaste «' + nombreProc(p) + '». Puedes buscar otro.';
        input.value = ''; items = []; cerrar(); input.focus();
      }).catch(function(err){
        if (li) li.querySelector('.bus-accion').textContent = 'Elegir';
        estadoEl.textContent = err.message;
      });
    }
    input.addEventListener('input', function(){ clearTimeout(timer); timer = setTimeout(correr, 200); });
    input.addEventListener('keydown', function(ev){
      if (ev.key === 'ArrowDown'){ ev.preventDefault(); if (lista.classList.contains('hidden')) { if (items.length) abrir(); else correr(); } else mover(1); }
      else if (ev.key === 'ArrowUp'){ ev.preventDefault(); mover(-1); }
      else if (ev.key === 'Enter'){ if (activo >= 0){ ev.preventDefault(); elegir(activo); } }
      else if (ev.key === 'Escape'){ cerrar(); }
    });
    input.addEventListener('blur', function(){ setTimeout(cerrar, 150); });
    input.addEventListener('focus', function(){ if (items.length && ultimo && input.value.trim() === ultimo) abrir(); });
    return { el: el, input: input };
  }

  function abrirNuevo(q){

  function pintarPaso1(){
    var ul = $('#listaElegidos');
    ul.innerHTML = '';
    var el = S.procesos.filter(function(p){ return !p.enSeccion && (p.elegido || p.propio); });
    el.forEach(function(p){ ul.appendChild(filaElegido(p)); });
    var sec = S.procesos.filter(function(p){ return p.enSeccion; });
    // Si lo que eligió es de su propia sección, ya aparece marcado abajo: no se muestra una lista vacía que confunda.
    var nada = !el.length && !procesosActivos().length;
    if (nada) ul.innerHTML = '<li class="vacio">Todavía no eliges procesos. Búscalos arriba' + (sec.length ? ' o márcalos en la lista de tu sección.' : '.') + '</li>';
    $('#elegidosT').classList.toggle('hidden', !el.length && !nada);
    ul.classList.toggle('hidden', !el.length && !nada);
    $('#bloqueSeccion').classList.toggle('hidden', !sec.length);
    // Solo se agregan las filas que faltan: las existentes conservan lo que la persona está escribiendo.

  function filaElegido(p){
    var li = document.createElement('li');
    var area = (p.gerencia !== S.encuestado.gerencia || p.seccion !== S.encuestado.seccion) ? areaProc(p) : '';
    li.innerHTML = '<div class="txt"><div class="proc-nombre">' + esc(nombreProc(p)) + (p.propio ? '<span class="tag">Agregado por ti</span>' : '') + '</div>' +
      '<div class="proc-ruta">' + esc([area, rutaProc(p)].filter(Boolean).join(' › ') || (p.codigo || '')) + '</div></div>' +
      '<button type="button" class="btn-link">Quitar</button>';
    li.querySelector('button').addEventListener('click', function(){ soltar(p); });
    return li;
  }

  function elegirPersonal(p){
    return api('/r/elegir', {proceso_id: p.id}).then(function(j){
      var q = j.proceso;
      var ya = S.procesos.filter(function(x){ return x.id === q.id; })[0];
      if (ya) Object.assign(ya, q); else S.procesos.push(q);
      var r = S.revisiones[q.id];
      if (!r || (r.estado !== 'vigente' && r.estado !== 'cambio')) S.revisiones[q.id] = {estado:'vigente', comentario: r ? r.comentario : ''};
      pintarPaso1();
      if (q.enSeccion) marcarRevision(q.id);
      pintarProcesos();
    });
  }

  function soltar(p){
    if (ocupado(p.id)){ alert('Espera a que termine la grabación de este proceso.'); return; }
    var tiene = PREGUNTAS.some(function(q){ return respondida(p.id, q.id); });
    if (!confirm('¿Quitar «' + nombreProc(p) + '» de tu lista?' + (tiene ? ' También se borrarán tus respuestas sobre este proceso.' : ''))) return;
    api('/r/soltar', {proceso_id: p.id}).then(function(){
      S.procesos = S.procesos.filter(function(x){ return x.id !== p.id || x.enSeccion; });
      delete S.revisiones[p.id]; delete S.respuestas[p.id];
      pintarPaso1();
      pintarProcesos();
    }).catch(function(err){ alert(err.message); });
  }

  function tarjetaRevision(p){
    var d = document.createElement('div');
    d.className = 'proc-rev';
    d.id = 'rev-' + p.id;
    var r = S.revisiones[p.id] || {};
    var ruta = rutaProc(p);
    d.innerHTML = '<div class="proc-nombre">' + esc(nombreProc(p)) + '</div>' +
      (ruta || p.codigo ? '<div class="proc-ruta">' + esc([p.codigo, ruta].filter(Boolean).join(' · ')) + '</div>' : '<div style="height:8px"></div>') +
      '<div class="pillbox" role="radiogroup" aria-label="Tu relación con este proceso">' +
        ESTADOS.map(function(o){
          return '<label class="pill"><input type="radio" name="rv-' + esc(p.id) + '" value="' + o[0] + '"' + (r.estado === o[0] ? ' checked' : '') + '><span>' + o[1] + '</span></label>';
        }).join('') + '</div>' +
      '<div class="' + (r.estado === 'cambio' || r.estado === 'no_existe' ? '' : 'hidden') + '" id="cm-' + esc(p.id) + '">' +
        '<label for="cmt-' + esc(p.id) + '">¿Qué cambió o por qué ya no se hace?</label>' +
        '<input type="text" id="cmt-' + esc(p.id) + '" maxlength="600" value="' + esc(r.comentario || '') + '"></div>' +
      '<div class="estado" id="rest-' + esc(p.id) + '"></div>';
    d.addEventListener('change', function(ev){ if (ev.target.name === 'rv-' + p.id) guardarRevision(p); });
    d.querySelector('#cmt-' + CSS.escape(p.id)).addEventListener('change', function(){ guardarRevision(p); });
    return d;
  }

  // Refleja en la fila de la sección un estado que cambió por otra vía (por ejemplo, elegirlo en el buscador).
  function marcarRevision(pid){
    var r = S.revisiones[pid] || {};
    var inp = document.querySelector('input[name="rv-' + CSS.escape(pid) + '"][value="' + r.estado + '"]');
    if (inp) inp.checked = true;
    var caja = document.getElementById('cm-' + pid);
    if (caja) caja.classList.toggle('hidden', !(r.estado === 'cambio' || r.estado === 'no_existe'));
  }

  function guardarRevision(p){
    var sel = document.querySelector('input[name="rv-' + CSS.escape(p.id) + '"]:checked');
    if (!sel) return;
    var cm = document.getElementById('cmt-' + p.id);
    document.getElementById('cm-' + p.id).classList.toggle('hidden', !(sel.value === 'cambio' || sel.value === 'no_existe'));
    var est = document.getElementById('rest-' + p.id);
    est.className = 'estado'; est.textContent = 'Guardando…';
    api('/r/revision', {proceso_id: p.id, estado: sel.value, comentario: cm ? cm.value : ''}).then(function(){
      S.revisiones[p.id] = {estado: sel.value, comentario: cm ? cm.value : ''};
      est.className = 'estado ok'; est.textContent = 'Guardado';
      pintarPaso1();
      pintarProcesos();
    }).catch(function(err){ est.className = 'estado warn'; est.textContent = err.message; });
  }

  function agregarProceso(){
    var nombre = $('#nvProceso').value.trim();
    var est = $('#estNuevo');
    if (!nombre){ est.className = 'estado warn'; est.textContent = 'Escribe el nombre del proceso.'; return; }
    est.className = 'estado'; est.textContent = 'Guardando…';
    api('/r/proceso', {proceso: nombre, macroproceso: $('#nvMacro').value, descripcion: $('#nvDesc').value}).then(function(j){
      S.procesos.push(j.proceso);
      S.revisiones[j.proceso.id] = {estado:'vigente', comentario:''};
      $('#nvProceso').value = ''; $('#nvMacro').value = ''; $('#nvDesc').value = '';
      $('#formNuevo').classList.add('hidden');
      est.textContent = '';
      pintarPaso1();
      pintarProcesos();
    }).catch(function(err){ est.className = 'estado warn'; est.textContent = err.message; });
  }

  // Procesos que se responden: los que la persona marcó como propios (participa), sean de su sección, elegidos o nuevos.
  function procesosActivos(){
    return S.procesos.filter(function(p){
      var r = S.revisiones[p.id];
      return r && (r.estado === 'vigente' || r.estado === 'cambio');
    });
  }

  function pintarProcesos(){
    var lista = $('#listaProc');
    var activos = procesosActivos();
    var ids = activos.map(function(p){ return p.id; });
    // Se quitan las tarjetas de procesos que dejaron de estar activos (salvo si se está grabando en ellas).
    Array.prototype.slice.call(lista.children).forEach(function(el){
      if (el.dataset.id && ids.indexOf(el.dataset.id) < 0 && !ocupado(el.dataset.id)) el.remove();
    });
    var vacio = $('#procVacio'); if (vacio) vacio.remove();
    activos.forEach(function(p){
      var el = document.getElementById('pr-' + p.id) || tarjetaProceso(p);
      lista.appendChild(el);   // appendChild de un nodo existente solo lo reordena, conserva su estado
    });
    if (!activos.length){
      var c = document.createElement('div');
      c.className = 'card'; c.id = 'procVacio'; c.style.color = 'var(--muted)';
      c.textContent = 'Cuando elijas en el paso 1 los procesos en los que participas, aparecerán aquí para que nos cuentes cómo funcionan.';
      lista.appendChild(c);
    }
    actualizarAvance();
  }

  function respuesta(pid, q){ return ((S.respuestas[pid] || {})[q]) || {texto:'', sistemas:[]}; }
  function respondida(pid, q){ var r = respuesta(pid, q); return !!(r.texto && r.texto.trim()) || (r.sistemas && r.sistemas.length > 0); }

  function tarjetaProceso(p){
    var d = document.createElement('details');
    d.className = 'proc';
    d.id = 'pr-' + p.id;
    d.dataset.id = p.id;
    var area = (p.gerencia !== S.encuestado.gerencia || p.seccion !== S.encuestado.seccion) ? areaProc(p) : '';
    var ruta = [area, rutaProc(p)].filter(Boolean).join(' › ');
    var html = '<summary><div class="sum-txt"><div class="proc-nombre">' + esc(nombreProc(p)) + '</div>' +
      (ruta ? '<div class="proc-ruta" style="margin:2px 0 0">' + esc(ruta) + '</div>' : '') + '</div>' +
      '<span class="avance" id="av-' + esc(p.id) + '"></span>' +
      '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>';
    PREGUNTAS.forEach(function(q, i){
      var r = respuesta(p.id, q.id);
      var key = p.id + '-' + q.id;
      html += '<div class="preg">' +
        '<div class="preg-t"><span class="qn">' + (i+1) + '</span><span>' + esc(q.t) + '</span></div>' +
        '<p class="preg-g">' + esc(q.g) + '</p>' +
        '<div class="rec-row">' +
          '<button class="btn btn-rec btn-sm btn-ico" type="button" data-rec="' + esc(key) + '"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="11" rx="3" fill="currentColor" stroke="none"></rect><path d="M5 10.5a7 7 0 0 0 14 0M12 17.5V21"></path></svg><span>Grabar</span></button>' +
          '<span class="rec-dot hidden" id="dot-' + esc(key) + '" aria-hidden="true"></span>' +
          '<span class="rec-timer hidden" id="tm-' + esc(key) + '">0:00</span>' +
          '<span class="estado" id="st-' + esc(key) + '" aria-live="polite"></span>' +
        '</div>' +
        '<textarea id="tx-' + esc(key) + '" maxlength="12000" aria-label="Respuesta a la pregunta ' + (i+1) + '" placeholder="Pulsa Grabar y habla, o escribe aquí…">' + esc(r.texto) + '</textarea>';
      if (q.sistemas && S.sistemas.length){
        html += '<div class="sis-t">Marca los sistemas que usan en este proceso</div><div class="pillbox">' +
          S.sistemas.map(function(s){
            return '<label class="pill"><input type="checkbox" data-sis="' + esc(key) + '" value="' + esc(s.nombre) + '"' + (r.sistemas.indexOf(s.nombre) >= 0 ? ' checked' : '') + '><span>' + esc(s.nombre) + '</span></label>';
          }).join('') + '</div>' +
          '<p class="preg-g" style="margin:8px 0 0">¿Usan algo que no está en la lista (un Excel, un aplicativo del área)? Menciónalo en el texto.</p>';
      }
      html += '</div>';
    });
    d.innerHTML = html;
    PREGUNTAS.forEach(function(q){
      var key = p.id + '-' + q.id;
      d.querySelector('#tx-' + CSS.escape(key)).addEventListener('input', function(){ programarGuardado(p.id, q.id); });
      d.querySelector('[data-rec="' + CSS.escape(key) + '"]').addEventListener('click', function(){ alternarGrabacion(p.id, q.id); });
      Array.prototype.forEach.call(d.querySelectorAll('[data-sis="' + CSS.escape(key) + '"]'), function(c){
        c.addEventListener('change', function(){ programarGuardado(p.id, q.id, 0); });
      });
    });
    pintarAvanceProc(p.id, d);
    return d;
  }

  function pintarAvanceProc(pid, root){
    var n = PREGUNTAS.filter(function(q){ return respondida(pid, q.id); }).length;
    var el = (root || document).querySelector('#av-' + CSS.escape(pid));
    if (el){ el.textContent = n === PREGUNTAS.length ? '✓ Completo' : n + ' de ' + PREGUNTAS.length; el.classList.toggle('full', n === PREGUNTAS.length); }
  }

  function actualizarAvance(){
    var activos = procesosActivos();
    var total = activos.length * PREGUNTAS.length, hechas = 0;
    activos.forEach(function(p){ PREGUNTAS.forEach(function(q){ if (respondida(p.id, q.id)) hechas++; }); pintarAvanceProc(p.id); });
    var pendientesRev = S.procesos.filter(function(p){ return p.enSeccion && !S.revisiones[p.id]; }).length;
    $('#pfill').style.width = (total ? Math.round(hechas * 100 / total) : 0) + '%';
    $('#ptext').textContent = (pendientesRev ? pendientesRev + ' por marcar en el paso 1 · ' : '') + hechas + ' de ' + total + ' respuestas';
  }

  // ------------------------------------------------------------ guardado
  var timers = {}, sinGuardar = {};
  function programarGuardado(pid, qid, espera){
    var key = pid + '-' + qid;
    sinGuardar[key] = true;
    if (!grab[key]) estado(key, 'Sin guardar…');
    clearTimeout(timers[key]);
    timers[key] = setTimeout(function(){ guardar(pid, qid); }, espera === undefined ? 1200 : espera);
  }
  function guardar(pid, qid){
    var key = pid + '-' + qid;
    clearTimeout(timers[key]);
    var ta = document.getElementById('tx-' + key);
    if (!ta) return Promise.resolve();
    var texto = ta.value;
    var sistemas = Array.prototype.map.call(document.querySelectorAll('[data-sis="' + CSS.escape(key) + '"]:checked'), function(c){ return c.value; });
    return api('/r/respuesta', {proceso_id: pid, pregunta: qid, texto: texto, sistemas: sistemas}).then(function(){
      delete sinGuardar[key];
      (S.respuestas[pid] = S.respuestas[pid] || {})[qid] = {texto: texto, sistemas: sistemas};
      if (!grab[key]) estado(key, 'Guardado', 'ok');
      actualizarAvance();
    }).catch(function(err){
      estado(key, 'No se guardó: ' + err.message + '. Vuelve a escribir para reintentar.', 'warn');
    });
  }
  window.addEventListener('beforeunload', function(ev){
    if (Object.keys(sinGuardar).length || Object.keys(grab).length){ ev.preventDefault(); ev.returnValue = ''; }
  });

  // ------------------------------------------------------------ grabación y transcripción
  var grab = {};   // key -> {pid, qid, rec, stream, chunks, secs, timer, fase}
  function ocupado(pid){ return Object.keys(grab).some(function(k){ return k.indexOf(pid + '-') === 0; }); }

  function alternarGrabacion(pid, qid){
    var key = pid + '-' + qid;
    if (grab[key] && grab[key].fase === 'grabando') return detener(key);
    if (grab[key]) return;   // transcribiendo
    iniciar(pid, qid);
  }

  function botonRec(key){ return document.querySelector('[data-rec="' + CSS.escape(key) + '"]'); }
  function estado(key, t, cls){ var st = document.getElementById('st-' + key); if (st){ st.className = 'estado' + (cls ? ' ' + cls : ''); st.textContent = t; } }

  function iniciar(pid, qid){
    var key = pid + '-' + qid;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
      estado(key, 'Tu navegador no permite grabar: escribe tu respuesta.', 'warn'); return;
    }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      var mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '');
      var rec = mime ? new MediaRecorder(stream, {mimeType: mime}) : new MediaRecorder(stream);
      var g = grab[key] = {pid: pid, qid: qid, rec: rec, stream: stream, chunks: [], secs: 0, fase: 'grabando'};
      rec.addEventListener('dataavailable', function(ev){ if (ev.data && ev.data.size) g.chunks.push(ev.data); });
      rec.addEventListener('stop', function(){ alDetener(key); });
      rec.start(1000);
      g.timer = setInterval(function(){
        g.secs++;
        document.getElementById('tm-' + key).textContent = fmt(g.secs);
        if (g.secs >= MAX_SEG) detener(key);
      }, 1000);
      var b = botonRec(key);
      b.querySelector('span').textContent = 'Detener';
      b.style.background = 'var(--accent)';
      document.getElementById('dot-' + key).classList.remove('hidden');
      var tm = document.getElementById('tm-' + key); tm.textContent = '0:00'; tm.classList.remove('hidden');
      estado(key, 'Grabando… habla con calma. Pulsa Detener al terminar (máx. 10 min).');
    }).catch(function(){
      estado(key, 'No se pudo usar el micrófono. Revisa el permiso del navegador o escribe tu respuesta.', 'warn');
    });
  }

  function detener(key){
    var g = grab[key];
    if (!g) return;
    clearInterval(g.timer);
    try { if (g.rec.state !== 'inactive') g.rec.stop(); } catch(e){}
  }

  function restaurarBoton(key){
    var b = botonRec(key);
    if (b){ b.querySelector('span').textContent = 'Grabar'; b.style.background = ''; b.disabled = false; }
    var dot = document.getElementById('dot-' + key); if (dot) dot.classList.add('hidden');
    var tm = document.getElementById('tm-' + key); if (tm) tm.classList.add('hidden');
  }

  function alDetener(key){
    var g = grab[key];
    g.stream.getTracks().forEach(function(t){ t.stop(); });
    g.fase = 'transcribiendo';
    restaurarBoton(key);
    botonRec(key).disabled = true;
    var blob = new Blob(g.chunks, {type: g.rec.mimeType || 'audio/webm'});
    if (!blob.size || g.secs < 1){ delete grab[key]; restaurarBoton(key); estado(key, 'No se capturó audio. Intenta de nuevo.', 'warn'); return; }
    estado(key, 'Convirtiendo tu voz en texto…');
    tramosWav(blob).then(function(tramos){
      var textos = [];
      var cadena = Promise.resolve();
      tramos.forEach(function(wav, i){
        cadena = cadena.then(function(){
          if (tramos.length > 1) estado(key, 'Convirtiendo tu voz en texto… (' + (i+1) + ' de ' + tramos.length + ')');
          return fetch(API + '/r/transcribir?k=' + encodeURIComponent(K), {method:'POST', headers:{'content-type':'audio/wav'}, body: wav})
            .then(function(r){ return r.json().then(function(j){ if (!r.ok || !j.ok) throw new Error(j.error || 'Error ' + r.status); return j; }); })
            .then(function(j){ if (j.texto) textos.push(j.texto); });
        });
      });
      return cadena.then(function(){ return textos.join(' '); });
    }).then(function(texto){
      delete grab[key];
      restaurarBoton(key);
      if (!texto){ estado(key, 'No se entendió el audio. Intenta de nuevo más cerca del micrófono o escribe.', 'warn'); return; }
      var ta = document.getElementById('tx-' + key);
      ta.value = (ta.value.trim() ? ta.value.trim() + '\n\n' : '') + texto;
      return guardar(g.pid, g.qid).then(function(){ estado(key, 'Listo. Revisa el texto y corrige lo que haga falta (se guarda solo).', 'ok'); });
    }).catch(function(err){
      delete grab[key];
      restaurarBoton(key);
      estado(key, (err && err.message) || 'No se pudo transcribir. Intenta de nuevo o escribe.', 'warn');
    });
  }

  // Decodifica lo grabado, lo pasa a 16 kHz mono y lo corta en tramos WAV de 2 minutos.
  // Así la transcripción funciona igual con Chrome (webm), Safari (mp4) o Firefox (ogg).
  function tramosWav(blob){
    return blob.arrayBuffer().then(function(buf){
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx = new Ctx();
      return new Promise(function(ok, ko){ ctx.decodeAudioData(buf, ok, ko); }).then(function(audio){
        ctx.close();
        var off = new OfflineAudioContext(1, Math.ceil(audio.duration * 16000), 16000);
        var src = off.createBufferSource();
        src.buffer = audio; src.connect(off.destination); src.start(0);
        return off.startRendering();
      });
    }).then(function(r){
      var datos = r.getChannelData(0), tam = TRAMO_SEG * 16000, out = [];
      for (var i = 0; i < datos.length; i += tam) out.push(wav(datos.subarray(i, Math.min(i + tam, datos.length)), 16000));
      return out;
    });
  }
  function wav(muestras, hz){
    var b = new ArrayBuffer(44 + muestras.length * 2), v = new DataView(b);
    function s(o, t){ for (var i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); }
    s(0,'RIFF'); v.setUint32(4, 36 + muestras.length * 2, true); s(8,'WAVE'); s(12,'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, hz, true);
    v.setUint32(28, hz * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); s(36,'data'); v.setUint32(40, muestras.length * 2, true);
    for (var i = 0, o = 44; i < muestras.length; i++, o += 2){ var x = Math.max(-1, Math.min(1, muestras[i])); v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7FFF, true); }
    return new Blob([b], {type:'audio/wav'});
  }
})();
</script>
