<style>
  :root{
    --bg:#E3E2DA; --card:#FFFFFF; --ink:#1C2B3A; --heading:#003478; --muted:#5B6B80;
    --line:#CFCDC2; --accent:#FF0054; --accent-soft:#FFE3EC; --navy:#003478;
    --panel:#F4F3EE; --field-line:#B9C4D4; --ok:#237A3F; --ok-bg:#E4F4E9;
    --warn:#8A5A00; --warn-bg:#FBF0DA; --ease:cubic-bezier(.23,1,.32,1);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#081426; --card:#0F2440; --ink:#E9EEF6; --heading:#BBD0EE; --muted:#9FB0C7;
      --line:#243C5E; --accent:#FF4D80; --accent-soft:#3A1128; --navy:#1E4A85;
      --panel:#0B1D37; --field-line:#31517D; --ok:#6FD08C; --ok-bg:#0E3320;
      --warn:#EFC26A; --warn-bg:#3A2B0A;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;font-size:16px;line-height:1.5}
  h1,h2,h3{font-family:Montserrat,"Trebuchet MS",sans-serif;color:var(--heading);margin:0;text-wrap:balance}
  .hero{background:linear-gradient(150deg,#003478 0%,#00234F 70%,#001A3C 100%);color:#fff;padding:30px 20px 36px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.10) 1px,transparent 1.6px);background-size:26px 26px;pointer-events:none}
  .hero-inner{max-width:820px;margin:0 auto;position:relative;z-index:1}
  .lockup{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .lockup .mbc-logo{height:22px;width:auto;display:block}
  .lockup .cliente-logo{height:44px;width:auto;display:block;background:#fff;border-radius:9px;padding:6px 12px;box-sizing:content-box}
  .lockup .sep{width:1px;height:26px;background:rgba(255,255,255,.28)}
  .lockup .tool{font-family:Montserrat,sans-serif;font-weight:700;font-size:15px}
  .eyebrow{font-family:Montserrat,sans-serif;font-size:13px;font-weight:600;color:#9FC1F2;margin:0 0 8px}
  .hero h1{color:#fff;font-size:clamp(24px,5vw,32px);font-weight:800;line-height:1.15}
  .hero p{max-width:46em;font-size:15.5px;color:#D7E3F5;margin:12px 0 0}
  .wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px;display:flex;flex-direction:column;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
  .card.destacado{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .card h2{font-size:19px;margin-bottom:6px}
  .lead{color:var(--muted);margin:0 0 14px;font-size:15px}
  .aviso{background:var(--panel);border-left:3px solid var(--navy);border-radius:0 10px 10px 0;padding:12px 16px;font-size:14px;color:var(--ink);margin:0}
  .aviso strong{color:var(--heading)}
  .paso{display:flex;gap:12px;align-items:baseline}
  .paso .n{font-family:Montserrat,sans-serif;font-weight:800;font-size:22px;color:var(--accent);min-width:26px}
  .paso > div{flex:1;min-width:0}
  label{display:block;font-family:Montserrat,sans-serif;font-weight:600;font-size:13px;color:var(--heading);margin:12px 0 5px}
  input[type=text],input[type=email],input[type=search],textarea,select{width:100%;background:var(--card);color:var(--ink);border:1.5px solid var(--field-line);border-radius:10px;padding:10px 12px;font:inherit}
  textarea{min-height:110px;resize:vertical}
  input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  @media (max-width:600px){ .grid2{grid-template-columns:1fr} }
  .fila{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .btn{appearance:none;cursor:pointer;font-family:Montserrat,sans-serif;font-weight:700;border-radius:11px;padding:12px 22px;font-size:14.5px;border:1.5px solid transparent;background:var(--accent);color:#fff;transition:transform 140ms var(--ease),filter 140ms ease}
  a.btn{display:inline-block;text-decoration:none}
  .btn:hover{filter:brightness(1.07)} .btn:active{transform:scale(.97)}
  .btn[disabled]{opacity:.55;cursor:not-allowed;filter:none;transform:none}
  .btn-ghost{background:none;border-color:var(--field-line);color:var(--heading)}
  .btn-sm{padding:9px 15px;font-size:13.5px;border-radius:9px}
  .btn-rec{background:var(--navy)}
  .btn-ico{display:inline-flex;align-items:center;gap:8px}
  .btn-link{appearance:none;background:none;border:none;cursor:pointer;color:var(--accent);font:inherit;font-size:14px;text-decoration:underline;padding:2px}
  .pillbox{display:flex;flex-wrap:wrap;gap:8px}
  .pill{position:relative;cursor:pointer}
  .pill input{position:absolute;opacity:0;pointer-events:none}
  .pill span{display:inline-block;border:1.5px solid var(--field-line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px;line-height:1.2}
  .pill input:checked + span{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
  .pill .det{display:inline-block;margin-left:7px;font-size:10.5px;font-weight:700;opacity:.85;border:1px solid currentColor;border-radius:999px;padding:0 6px;vertical-align:middle}
  .pill input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
  .guia{margin:0;padding-left:20px;font-size:15px;color:var(--muted)}
  .guia li{margin:3px 0}
  .guia strong{color:var(--heading)}
  .sub-t{font-family:Montserrat,sans-serif;font-weight:700;font-size:14px;color:var(--heading);margin:22px 0 2px}
  .proc-rev{border-top:1px solid var(--line);padding:14px 0}
  .proc-rev:first-child{border-top:none}
  .proc-nombre{font-family:Montserrat,sans-serif;font-weight:700;color:var(--heading);font-size:15.5px}
  .proc-ruta{color:var(--muted);font-size:13px;margin:2px 0 10px}
  .tag{display:inline-block;font-family:Montserrat,sans-serif;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;margin-left:6px;vertical-align:middle;background:var(--accent-soft);color:var(--accent)}
  .lista-el{list-style:none;margin:0;padding:0}

  .lista-el li .proc-ruta{margin-bottom:0}

  input.bus-input{padding:13px 14px 13px 42px;font-size:16px}
  .bus-estado{font-size:13px;color:var(--muted);margin:6px 0 0;min-height:1.3em}

  .bus-fijo{position:sticky;top:var(--barra-h,0px);z-index:5;background:var(--card);padding:10px 0 6px;margin-top:-10px}
  .bus-fijo.pegado{box-shadow:0 10px 12px -10px rgba(0,0,0,.35)}
  .bus-op{padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;display:flex;gap:12px;align-items:center}
  .bus-op:first-child{border-top:none}
  .bus-op:hover,.bus-op[aria-selected=true]{background:var(--panel)}
  .bus-op .txt{flex:1;min-width:0}
  .bus-nombre{font-family:Montserrat,sans-serif;font-weight:700;color:var(--heading);font-size:15px}
  .bus-ruta{color:var(--muted);font-size:12.5px;margin-top:2px}
  .bus-accion{flex:none;font-family:Montserrat,sans-serif;font-weight:700;font-size:13px;color:var(--accent)}
  .bus-op.ya{cursor:default}
  .bus-op.ya .bus-accion{color:var(--ok)}
  .bus-pie{padding:11px 14px;border-top:1px solid var(--line);background:var(--panel);font-size:14px}
  mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
  .enlace-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .enlace-box input{flex:1;min-width:220px;font-size:13px;padding:8px 10px}
  details.proc{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  details.proc > summary{list-style:none;cursor:pointer;padding:18px 20px;display:flex;align-items:center;gap:14px}
  details.proc > summary::-webkit-details-marker{display:none}
  details.proc[open] > summary{border-bottom:1px solid var(--line)}
  .sum-txt{flex:1;min-width:0}
  .avance{font-family:Montserrat,sans-serif;font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .avance.full{color:var(--ok)}
  .chev{flex:none;transition:transform 180ms var(--ease);color:var(--muted)}
  details.proc[open] .chev{transform:rotate(180deg)}
  .preg{padding:18px 20px;border-top:1px solid var(--line)}
  .preg:first-child{border-top:none}
  .preg-t{font-family:Montserrat,sans-serif;font-weight:700;color:var(--heading);font-size:15px;display:flex;gap:10px}
  .preg-t .qn{flex:none;width:26px;height:26px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-content:center;font-size:13px}
  .preg-g{color:var(--muted);font-size:13.5px;margin:4px 0 12px 36px}
  @media (max-width:560px){ .preg-g{margin-left:0} }
  .rec-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .rec-timer{font-family:Montserrat,sans-serif;font-weight:700;font-size:18px;color:var(--heading);font-variant-numeric:tabular-nums;min-width:48px}
  .rec-dot{width:11px;height:11px;border-radius:50%;background:var(--accent);animation:blink 1s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion: reduce){ .rec-dot{animation:none} .chev,.btn{transition:none} }
  .estado{font-size:13px;color:var(--muted);min-height:1.4em}
  .estado.ok{color:var(--ok)} .estado.warn{color:var(--warn)}
  .sis-t{font-family:Montserrat,sans-serif;font-size:12.5px;font-weight:700;color:var(--muted);margin:12px 0 8px}
  .barra{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
  .barra-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:14px}
  .pbar{flex:1;height:8px;border-radius:99px;background:var(--panel);overflow:hidden}
  .pbar div{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s ease}
  .ptext{font-family:Montserrat,sans-serif;font-size:12.5px;font-weight:700;color:var(--heading);white-space:nowrap;font-variant-numeric:tabular-nums}
  .msg{border-radius:12px;padding:12px 16px}
  .msg.warn{background:var(--warn-bg);color:var(--warn)} .msg.ok{background:var(--ok-bg);color:var(--ok)}
  /* Checklist de cada bloque: lo que la matriz necesita saber */
  .ck-t{font-family:Montserrat,sans-serif;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 6px 36px}
  .ck{list-style:none;margin:0 0 14px 36px;padding:0;display:flex;flex-direction:column;gap:8px}
  @media (max-width:560px){ .ck,.ck-t{margin-left:0} }
  .ck li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.35}
  .ck .caja{flex:none;width:19px;height:19px;border-radius:5px;border:2px solid var(--field-line);display:grid;place-content:center;font-size:12px;font-weight:800;line-height:1;margin-top:1px;color:transparent}
  .ck li.cubierto .caja{background:var(--ok);border-color:var(--ok);color:#fff}
  .ck li.no_aplica .caja{background:var(--panel);border-color:var(--muted);color:var(--muted)}
  .ck li.falta .caja{border-color:var(--warn)}
  .ck .t{flex:1;min-width:0}
  .ck .nota{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
  .ck li.falta .nota{color:var(--warn)}
  .ck .acc{flex:none;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
  .btn-mini{appearance:none;cursor:pointer;background:var(--card);border:1.5px solid var(--field-line);color:var(--heading);border-radius:8px;padding:3px 9px;font-family:Montserrat,sans-serif;font-weight:600;font-size:12px;white-space:nowrap}
  .btn-mini:hover{border-color:var(--navy)} .btn-mini[disabled]{opacity:.5;cursor:default}
  .sug{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px;margin:10px 0 0}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .bus-persona{padding:12px 14px;border-top:1px solid var(--line);background:var(--panel);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .bus-persona:first-child{border-top:none}
  .bus-persona .txt{flex:1;min-width:0;font-size:14px}
  .previas{background:var(--panel);border-radius:12px;padding:10px 14px;margin:14px 20px 0;font-size:14px}
  .previas summary{cursor:pointer;font-family:Montserrat,sans-serif;font-weight:700;font-size:13px;color:var(--heading)}
  .previas p{white-space:pre-wrap;margin:8px 0 0}
  .foot{background:linear-gradient(150deg,#003478,#00234F);color:#C6D6EC;padding:22px 16px}
  .foot-inner{max-width:820px;margin:0 auto;font-size:12.5px}
  .hidden{display:none !important}
</style>
</head>
