<script>
'use strict';
(function(){
  var API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://127.0.0.1:8787' : 'https://voz-relevamiento-api.minsait-business-consulting-pe.workers.dev';
  var TRAMO_SEG = 120;          // el audio se envía en tramos de 2 minutos (16 kHz, mono)
  var MAX_SEG = 600;            // hasta 10 minutos por grabación
  // Cada proceso se responde en 3 bloques que vienen del servidor con su checklist (lo que la matriz necesita saber).
  var BLOQUES = [];
  // Formato anterior (6 preguntas): si alguien ya respondió así, se le muestra como referencia.
  var PREG_ANTES = {q1:'Objetivo, inicio y fin', q2:'Actividades y participantes', q3:'Sistemas y manualidad', q4:'Terceros', q5:'Datos personales', q6:'Indicadores, normas y frecuencia'};
  var ORIGEN_ASIG = {inventario:'En el inventario anterior', consultor:'Asignado por el equipo'};
  var EST_TXT = {cubierto:'Cubierto', falta:'Falta', no_aplica:'No aplica', pendiente:'Pendiente'};
  // Relación de la persona con un proceso de su sección que viene del inventario.
  var ESTADOS = [['vigente','Participo'], ['cambio','Participo, pero cambió'], ['no_participo','Existe, no participo'], ['no_existe','Ya no se hace']];

  var $ = function(s){ return document.querySelector(s); };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmt(s){ return Math.floor(s/60)+':'+('0'+Math.floor(s%60)).slice(-2); }
  function sinTildes(s){ return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  var VACIAS = ['de','del','la','las','el','los','y','e','en','a','al','para','por','con','un','una','o'];
  function terminos(q){
    var t = sinTildes(q).split(/\s+/).filter(Boolean);
    if (t.length > 1) t = t.filter(function(x){ return VACIAS.indexOf(x) < 0; });
    return t;
  }
  // Marca las palabras buscadas sin importar tildes ni mayúsculas.
  function resaltar(texto, q){
    texto = String(texto == null ? '' : texto);
    var n = sinTildes(texto);
    if (n.length !== texto.length) return esc(texto);
    var marca = [], i, k;
    for (i = 0; i < texto.length; i++) marca.push(false);
    terminos(q).forEach(function(t){
      var p = n.indexOf(t);
      while (p >= 0){ for (var j = p; j < p + t.length; j++) marca[j] = true; p = n.indexOf(t, p + t.length); }
    });
    var out = '', abierto = false;
    for (k = 0; k < texto.length; k++){
      if (marca[k] && !abierto){ out += '<mark>'; abierto = true; }
      if (!marca[k] && abierto){ out += '</mark>'; abierto = false; }
      out += esc(texto[k]);
    }
    return out + (abierto ? '</mark>' : '');
  }

  var params = new URLSearchParams(location.search);
  var K = params.get('k') || '';
  var C = params.get('c') || '';
  var G = params.get('g') || '';
  var S = null;   // sesión personal: {campana, encuestado, procesos, revisiones, respuestas, sistemas}
  var A = null;   // enlace abierto: {campana, dominio, areas}

  function api(path, body){
    var opt = body ? {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(Object.assign({k:K}, body))} : {};
    // Sin conexión con el servidor (red corporativa que lo bloquea, sin internet): un mensaje que la persona pueda resolver.
    return fetch(API + path, opt).catch(function(){
      throw new Error('No pudimos conectarnos con el servidor de la encuesta. Si estás en la red de tu empresa, ábrela desde tu celular con datos móviles, o avisa al equipo consultor.');
    }).then(function(r){
      return r.json().catch(function(){ return {ok:false, error:'Respuesta inesperada del servidor'}; }).then(function(j){
        if (!r.ok || !j.ok) throw new Error(j.error || ('Error ' + r.status));
        return j;
      });
    });
  }

  function errorGeneral(t){
    var e = $('#errorGeneral');
    if (!e){   // la vista pudo reemplazar el contenedor original
      e = document.createElement('div');
      e.id = 'errorGeneral'; e.className = 'msg warn'; e.setAttribute('role', 'alert');
      $('#root').insertBefore(e, $('#root').firstChild);
    }
    e.textContent = t; e.classList.remove('hidden');
  }
  function nombreProc(p){ return p.subproceso || p.proceso || p.macroproceso; }
  function rutaProc(p){ return [p.macroproceso, p.proceso, p.subproceso].filter(Boolean).filter(function(x){ return x !== nombreProc(p); }).join(' › '); }
  function areaProc(p){ return [p.gerencia, p.seccion].filter(Boolean).join(' · '); }
  // El logo del cliente acompaña a la marca MBC, no la reemplaza.
  function ponerLogo(camp){
    if (!camp || !camp.logo || document.querySelector('.hero .cliente-logo')) return;
    var lockup = document.querySelector('.hero .lockup');
    var sep = document.createElement('span'); sep.className = 'sep';
    var img = document.createElement('img'); img.className = 'cliente-logo'; img.src = camp.logo; img.alt = camp.cliente || 'Logo del cliente';
    lockup.appendChild(sep); lockup.appendChild(img);
  }

  // ------------------------------------------------------------ buscador de procesos
  // Patrón combobox: escribes, las flechas recorren la lista y Enter elige.
  var nBus = 0;
  function crearBuscador(o){
    var id = 'bus' + (++nBus);
    var el = document.createElement('div');
    el.innerHTML =
      '<label for="' + id + '">' + esc(o.etiqueta) + '</label>' +
      '<div class="bus-caja"><svg class="bus-lupa" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>' +
      '<input type="search" class="bus-input" id="' + id + '" role="combobox" aria-expanded="false" aria-controls="' + id + '-l" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="' + esc(o.placeholder) + '"></div>' +
      '<p class="bus-estado" aria-live="polite"></p>' +
      '<ul class="bus-lista hidden" id="' + id + '-l" role="listbox" aria-label="Procesos encontrados"></ul>';
    var input = el.querySelector('input'), lista = el.querySelector('ul'), estadoEl = el.querySelector('.bus-estado');
    var items = [], personasRes = [], activo = -1, seq = 0, timer = null, ultimo = '';

    function cerrar(){ lista.classList.add('hidden'); input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant'); activo = -1; }
    function abrir(){ lista.classList.remove('hidden'); input.setAttribute('aria-expanded', 'true'); }
    function mover(d){
      var ops = lista.querySelectorAll('[role=option]');
      if (!ops.length) return;
      activo = (activo + d + ops.length) % ops.length;
      Array.prototype.forEach.call(ops, function(op, i){ op.setAttribute('aria-selected', i === activo ? 'true' : 'false'); });
      input.setAttribute('aria-activedescendant', ops[activo].id);
      ops[activo].scrollIntoView({block:'nearest'});
    }
    function correr(){
      var q = input.value.trim();
      ultimo = q;
      if (sinTildes(q).replace(/\s/g, '').length < 2){ cerrar(); estadoEl.textContent = q ? 'Escribe al menos 2 letras.' : ''; return; }
      var mio = ++seq;
      estadoEl.textContent = 'Buscando…';
      o.buscar(q).then(function(j){
        if (mio !== seq) return;
        // Los que ya están en la lista de la persona van primero (sin alterar el orden de relevancia dentro de cada grupo).
        items = (j.resultados || []);
        items = items.filter(function(p){ return o.yaElegido(p); }).concat(items.filter(function(p){ return !o.yaElegido(p); }));
        personasRes = o.elegirVarios ? (j.personas || []) : [];
        pintar(q, j.total || 0);
      }).catch(function(err){ if (mio === seq) estadoEl.textContent = err.message; });
    }
    function pintar(q, total){
      lista.innerHTML = '';
      activo = -1;
      // Quien escribe su nombre ve los procesos donde figura en el inventario anterior y los elige de una vez.
      personasRes.forEach(function(g){
        var faltan = g.procesos.filter(function(p){ return !o.yaElegido(p); });
        var li = document.createElement('li');
        li.className = 'bus-persona';
        li.innerHTML = '<div class="txt"><b>' + resaltar(g.nombre, q) + '</b> figura en ' + (g.total === 1 ? '1 proceso' : g.total + ' procesos') + ' del inventario anterior.' +
          (g.total > g.procesos.length ? ' Puedes elegir los primeros ' + g.procesos.length + '.' : '') + '</div>' +
          (faltan.length ? '<button type="button" class="btn btn-sm">' + (faltan.length === 1 ? 'Elegir ese proceso' : 'Elegir los ' + faltan.length) + '</button>'
            : '<span class="bus-accion" style="color:var(--ok)">✓ Ya están en tu lista</span>');
        li.addEventListener('mousedown', function(ev){ ev.preventDefault(); });
        var b = li.querySelector('button');
        if (b) b.addEventListener('click', function(){
          b.disabled = true; b.textContent = 'Agregando…';
          Promise.resolve(o.elegirVarios(faltan)).then(function(){
            estadoEl.textContent = 'Agregaste ' + (faltan.length === 1 ? '1 proceso' : faltan.length + ' procesos') + ' de ' + g.nombre + '. Están en tu lista.';
            input.value = ''; items = []; personasRes = []; cerrar(); input.focus();
          }).catch(function(err){ b.disabled = false; b.textContent = 'Elegir los ' + faltan.length; estadoEl.textContent = err.message; });
        });
        lista.appendChild(li);
      });
      items.forEach(function(p, i){
        var ya = o.yaElegido(p);
        var li = document.createElement('li');
        li.className = 'bus-op' + (ya ? ' ya' : '');
        li.id = id + '-o' + i;
        li.setAttribute('role', 'option');
        li.setAttribute('aria-selected', 'false');
        if (ya) li.setAttribute('aria-disabled', 'true');
        var ruta = [areaProc(p), rutaProc(p)].filter(Boolean).join(' › ');
        li.innerHTML = '<div class="txt"><div class="bus-nombre">' + resaltar(nombreProc(p), q) + (p.nuevo ? '<span class="tag">Agregado en la encuesta</span>' : '') + '</div>' +
          '<div class="bus-ruta">' + resaltar(ruta, q) + (p.codigo ? ' · ' + resaltar(p.codigo, q) : '') +
            (p.persona ? ' · En el inventario anterior: ' + resaltar(p.persona, q) : '') + '</div></div>' +
          '<span class="bus-accion">' + (ya ? '✓ Ya está en tu lista' : 'Elegir') + '</span>';
        li.addEventListener('mousedown', function(ev){ ev.preventDefault(); });   // el campo no pierde el foco
        li.addEventListener('click', function(){ elegir(i); });
        lista.appendChild(li);
      });
      if (o.agregar){
        var pie = document.createElement('li');
        pie.className = 'bus-pie';
        pie.innerHTML = (items.length ? '¿No es ninguno de estos? ' : 'No encontramos «' + esc(q) + '» en el inventario. ') +
          '<button type="button" class="btn-link">' + esc(o.textoAgregar) + '</button>';
        pie.addEventListener('mousedown', function(ev){ ev.preventDefault(); });
        pie.querySelector('button').addEventListener('click', function(){ cerrar(); o.agregar(q); });
        lista.appendChild(pie);
      }
      estadoEl.textContent = !total ? 'Sin coincidencias.' :
        total > items.length ? 'Mostrando ' + items.length + ' de ' + total + '. Escribe más letras para afinar.' :
        total + (total === 1 ? ' proceso encontrado.' : ' procesos encontrados.');
      abrir();
    }
    function elegir(i){
      var p = items[i];
      if (!p || o.yaElegido(p)) return;
      var li = document.getElementById(id + '-o' + i);
      if (li) li.querySelector('.bus-accion').textContent = 'Agregando…';
      Promise.resolve(o.elegir(p)).then(function(){
        estadoEl.textContent = 'Agregaste «' + nombreProc(p) + '». Puedes buscar otro.';
        input.value = ''; items = []; cerrar(); input.focus();
      }).catch(function(err){
        if (li) li.querySelector('.bus-accion').textContent = 'Elegir';
        estadoEl.textContent = err.message;
      });
    }
    input.addEventListener('input', function(){ clearTimeout(timer); timer = setTimeout(correr, 200); });
    input.addEventListener('keydown', function(ev){
      if (ev.key === 'ArrowDown'){ ev.preventDefault(); if (lista.classList.contains('hidden')) { if (items.length) abrir(); else correr(); } else mover(1); }
      else if (ev.key === 'ArrowUp'){ ev.preventDefault(); mover(-1); }
      else if (ev.key === 'Enter'){ if (activo >= 0){ ev.preventDefault(); elegir(activo); } }
      else if (ev.key === 'Escape'){ cerrar(); }
    });
    input.addEventListener('blur', function(){ setTimeout(cerrar, 150); });
    input.addEventListener('focus', function(){ if (items.length && ultimo && input.value.trim() === ultimo) abrir(); });
    return { el: el, input: input };
  }

  // ------------------------------------------------------------ arranque
  if (K) cargarPersonal();
  else if (C) cargarAbierto();
  else {
    $('#heroIntro').textContent = 'Este enlace no es válido.';
    errorGeneral('Abre la encuesta desde el enlace que te enviaron por correo.');
  }

  // ============================================================ enlace abierto (?c=)
  var ELEGIDOS = [];                 // procesos elegidos antes de identificarse
  var QUIERE_NUEVO = false, NUEVO_TEXTO = '';

  function cargarAbierto(){
    api('/r/abierta?c=' + encodeURIComponent(C)).then(function(j){ A = j; pintarAbierto(); })
      .catch(function(err){ $('#heroIntro').textContent = 'No pudimos abrir la encuesta.'; errorGeneral(err.message); });
  }

  function pintarAbierto(){
    $('#heroEyebrow').textContent = [A.campana.cliente, G, 'Relevamiento de procesos'].filter(Boolean).join(' · ');
    $('#heroTitle').textContent = '¿Qué proceso nos vas a contar?';
    $('#heroIntro').innerHTML = 'Escribe unas letras del nombre de tu proceso, o tu nombre, y elige tus procesos de la lista. Luego nos cuentas cómo funcionan, <strong>hablando</strong> o escribiendo.';
    ponerLogo(A.campana);
    var root = $('#root');
    root.innerHTML = '';

    // Si ya se registró desde este equipo, puede seguir donde se quedó.
    var guardado = null;
    try { guardado = JSON.parse(localStorage.getItem('relev-' + C) || 'null'); } catch(e){}
    if (guardado && guardado.k){
      var sigue = document.createElement('section');
      sigue.className = 'card destacado';
      sigue.innerHTML = '<h2>Hola de nuevo, ' + esc(String(guardado.nombre || '').split(' ')[0]) + '</h2>' +
        '<p class="lead">Desde este equipo ya empezaste la encuesta. Puedes continuar donde te quedaste.</p>' +
        '<div class="fila"><a class="btn" href="?k=' + encodeURIComponent(guardado.k) + '">Continuar mi encuesta</a>' +
        '<button type="button" class="btn-link" id="noSoy">No soy esa persona</button></div>';
      root.appendChild(sigue);
      sigue.querySelector('#noSoy').addEventListener('click', function(){ try { localStorage.removeItem('relev-' + C); } catch(e){} sigue.remove(); });
    }

    var paso1 = document.createElement('section');
    paso1.className = 'card';
    paso1.innerHTML = '<div class="paso"><span class="n">1</span><div><h2>Busca y elige tu proceso</h2>' +
      '<p class="lead">Si participas en varios, elige todos. También puedes escribir tu nombre y apellido: si figuras en el inventario anterior, verás tus procesos para elegirlos de una vez.</p>' +
      '<div id="busA" class="bus-fijo"></div>' +
      '<p class="sub-t hidden" id="elegT">Elegiste</p><ul class="lista-el" id="elegL"></ul>' +
      '<p class="msg ok hidden" id="nuevoNota" style="margin:12px 0 0"></p>' +
      '<div class="fila" style="margin-top:16px"><button class="btn" type="button" id="btnSeguir" disabled>Continuar</button>' +
      '<button type="button" class="btn-link" id="btnNoEncuentro">No encuentro mi proceso</button></div></div></div>';
    root.appendChild(paso1);

    var bus = crearBuscador({
      etiqueta: 'Nombre de tu proceso o tu nombre', placeholder: 'Ej.: importación, facturación… o tu nombre y apellido',
      buscar: function(q){ return api('/r/buscar?c=' + encodeURIComponent(C) + '&g=' + encodeURIComponent(G) + '&q=' + encodeURIComponent(q)); },
      yaElegido: function(p){ return ELEGIDOS.some(function(x){ return x.id === p.id; }); },
      elegir: function(p){ ELEGIDOS.push(p); pintarElegidosA(); },
      elegirVarios: function(ps){
        ps.forEach(function(p){ if (!ELEGIDOS.some(function(x){ return x.id === p.id; })) ELEGIDOS.push(p); });
        pintarElegidosA();
      },
      agregar: function(q){ marcarNuevo(q); }, textoAgregar: 'Agregarlo como proceso nuevo'
    });
    paso1.querySelector('#busA').appendChild(bus.el);
    paso1.querySelector('#btnNoEncuentro').addEventListener('click', function(){ marcarNuevo(bus.input.value.trim()); });
    paso1.querySelector('#btnSeguir').addEventListener('click', mostrarRegistro);
    programarFijo();

    root.appendChild(tarjetaRegistro());
  }

  function marcarNuevo(q){
    QUIERE_NUEVO = true;
    NUEVO_TEXTO = q || '';
    var n = $('#nuevoNota');
    n.textContent = 'Perfecto: después de identificarte podrás agregar ' + (q ? '«' + q + '»' : 'tu proceso') + ' como proceso nuevo.';
    n.classList.remove('hidden');
    pintarElegidosA();
  }

  function pintarElegidosA(){
    var ul = $('#elegL');
    ul.innerHTML = '';
    ELEGIDOS.forEach(function(p){
      var li = document.createElement('li');
      li.innerHTML = '<div class="txt"><div class="proc-nombre">' + esc(nombreProc(p)) + '</div><div class="proc-ruta">' + esc([areaProc(p), rutaProc(p)].filter(Boolean).join(' › ')) + '</div></div>' +
        '<button type="button" class="btn-link">Quitar</button>';
      li.querySelector('button').addEventListener('click', function(){
        ELEGIDOS = ELEGIDOS.filter(function(x){ return x.id !== p.id; });
        pintarElegidosA();
      });
      ul.appendChild(li);
    });
    $('#elegT').classList.toggle('hidden', !ELEGIDOS.length);
    $('#btnSeguir').disabled = !(ELEGIDOS.length || QUIERE_NUEVO);
  }

  function tarjetaRegistro(){
    var c = document.createElement('section');
    c.className = 'card hidden';
    c.id = 'cardReg';
    var dom = A.dominio ? '@' + A.dominio : '';
    c.innerHTML = '<div class="paso"><span class="n">2</span><div><h2>¿Quién eres?</h2>' +
      '<p class="lead">Lo usamos para coordinar contigo la reunión de validación. Si figuras en el inventario anterior, también verás en tu lista los procesos donde apareces.</p>' +
      '<div class="grid2">' +
        '<div><label for="rNombre">Nombre y apellido *</label><input type="text" id="rNombre" autocomplete="name" maxlength="150"></div>' +
        '<div><label for="rCorreo">Correo corporativo *</label><input type="email" id="rCorreo" autocomplete="email" maxlength="150" placeholder="' + esc(dom ? 'nombre' + dom : 'nombre@empresa.com') + '"></div>' +
        '<div><label for="rGer">Tu gerencia *</label><select id="rGer"></select><input type="text" id="rGerOtra" class="hidden" maxlength="150" placeholder="Escribe tu gerencia" style="margin-top:8px" aria-label="Tu gerencia"></div>' +
        '<div><label for="rSec">Tu sección *</label><select id="rSec"></select><input type="text" id="rSecOtra" class="hidden" maxlength="150" placeholder="Escribe tu sección" style="margin-top:8px" aria-label="Tu sección"></div>' +
        '<div><label for="rCargo">Cargo (opcional)</label><input type="text" id="rCargo" maxlength="80" autocomplete="organization-title"></div>' +
      '</div>' +
      '<p class="aviso" style="margin-top:16px"><strong>Cómo tratamos lo que nos cuentas.</strong> Tu voz se convierte en texto y el audio se descarta al instante. La información se usa solo para el inventario de procesos y se borra al cierre del proyecto.</p>' +
      '<div class="fila" style="margin-top:16px"><button class="btn" type="button" id="btnEmpezar">Empezar a responder</button><span class="estado" id="rEstado" role="status"></span></div>' +
      '</div></div>';
    var selG = c.querySelector('#rGer'), selS = c.querySelector('#rSec');
    selG.innerHTML = '<option value="">Elige tu gerencia…</option>' + A.areas.map(function(a){ return '<option>' + esc(a.gerencia) + '</option>'; }).join('') + '<option value="__otra">Otra…</option>';
    function llenarSecciones(){
      var g = selG.value, area = A.areas.filter(function(a){ return a.gerencia === g; })[0];
      c.querySelector('#rGerOtra').classList.toggle('hidden', g !== '__otra');
      selS.innerHTML = (area ? '<option value="">Elige tu sección…</option>' + area.secciones.map(function(s){ return '<option>' + esc(s) + '</option>'; }).join('') : '') + '<option value="__otra">Otra…</option>';
      if (!area) selS.value = '__otra';
      c.querySelector('#rSecOtra').classList.toggle('hidden', selS.value !== '__otra');
    }
    selG.addEventListener('change', llenarSecciones);
    selS.addEventListener('change', function(){ c.querySelector('#rSecOtra').classList.toggle('hidden', selS.value !== '__otra'); });
    llenarSecciones();
    c.querySelector('#btnEmpezar').addEventListener('click', registrar);
    return c;
  }

  // Sugiere la gerencia del enlace (?g=) o la del primer proceso elegido.
  function mostrarRegistro(){
    var c = $('#cardReg');
    c.classList.remove('hidden');
    var selG = $('#rGer');
    if (!selG.value){
      var p = ELEGIDOS[0] || {};
      var g = [G, p.gerencia].filter(function(x){ return x && A.areas.some(function(a){ return a.gerencia === x; }); })[0];
      if (g){
        selG.value = g;
        selG.dispatchEvent(new Event('change'));
        if (p.gerencia === g && Array.prototype.some.call($('#rSec').options, function(o){ return o.value === p.seccion; })){
          $('#rSec').value = p.seccion;
          $('#rSec').dispatchEvent(new Event('change'));
        }
      }
    }
    c.scrollIntoView({behavior:'smooth', block:'start'});
    setTimeout(function(){ $('#rNombre').focus({preventScroll:true}); }, 300);
  }

  function registrar(){
    var est = $('#rEstado');
    var ger = $('#rGer').value === '__otra' ? $('#rGerOtra').value.trim() : $('#rGer').value;
    var sec = $('#rSec').value === '__otra' ? $('#rSecOtra').value.trim() : $('#rSec').value;
    var datos = {c: C, nombre: $('#rNombre').value.trim(), correo: $('#rCorreo').value.trim(), gerencia: ger, seccion: sec,
      cargo: $('#rCargo').value.trim(), procesos: ELEGIDOS.map(function(p){ return p.id; })};
    var falta = !datos.nombre ? 'Escribe tu nombre y apellido.' : !datos.correo ? 'Escribe tu correo.' : !ger ? 'Indica tu gerencia.' : !sec ? 'Indica tu sección.' : '';
    if (falta){ est.className = 'estado warn'; est.textContent = falta; return; }
    var b = $('#btnEmpezar');
    b.disabled = true; est.className = 'estado'; est.textContent = 'Registrando…';
    api('/r/registro', datos).then(function(j){
      try { localStorage.setItem('relev-' + C, JSON.stringify({k: j.k, nombre: j.nombre})); } catch(e){}
      location.replace('?k=' + encodeURIComponent(j.k) + '&bienvenida=1' + (QUIERE_NUEVO ? '&nuevo=' + encodeURIComponent(NUEVO_TEXTO) : ''));
    }).catch(function(err){ b.disabled = false; est.className = 'estado warn'; est.textContent = err.message; });
  }

  // ============================================================ enlace personal (?k=)
  function cargarPersonal(){
    api('/r/sesion?k=' + encodeURIComponent(K)).then(function(j){
      S = j;
      S.revisiones = S.revisiones || {};
      S.respuestas = S.respuestas || {};
      BLOQUES = S.bloques || [];
      pintar();
    }).catch(function(err){
      $('#heroIntro').textContent = 'No pudimos abrir tu encuesta.';
      errorGeneral(err.message + '. Si el problema sigue, escribe al equipo consultor.');
    });
  }

  function miEnlace(){ return location.origin + location.pathname + '?k=' + encodeURIComponent(K); }

  function pintar(){
    var e = S.encuestado;
    var bienvenida = params.has('bienvenida'), nuevo = params.get('nuevo');
    if (bienvenida || nuevo !== null) history.replaceState(null, '', location.pathname + '?k=' + encodeURIComponent(K));
    $('#heroEyebrow').textContent = (S.campana ? S.campana.cliente + ' · ' : '') + e.gerencia + ' · ' + e.seccion;
    $('#heroTitle').textContent = 'Hola, ' + e.nombre.split(' ')[0] + ': cuéntanos cómo funcionan tus procesos';
    $('#heroIntro').innerHTML = 'Son tres partes. Primero confirmas tus procesos del inventario; luego, si hace falta, buscas otros en los que participes; y al final nos cuentas, <strong>hablando</strong> o escribiendo, cómo funciona cada uno. Todo se guarda solo: puedes dejarlo y volver con tu enlace.';
    ponerLogo(S.campana);

    var root = $('#root');
    root.innerHTML = '';
    var intro = document.createElement('section');
    var porNombre = S.procesos.filter(function(p){ return p.asignado === 'inventario' && !S.revisiones[p.id]; }).length;
    intro.className = 'card' + (bienvenida ? ' destacado' : '');
    intro.innerHTML = (bienvenida ? '<h2>Listo, ya estás registrado</h2><p class="lead">Guarda tu enlace personal: con él vuelves a tu encuesta desde cualquier equipo. Es solo tuyo, no lo compartas.' +
        (porNombre ? ' Figuras en ' + (porNombre === 1 ? '1 proceso' : porNombre + ' procesos') + ' del inventario anterior: están en la parte 1 para que confirmes tu relación con cada uno.' : '') + '</p>' : '') +
      '<p class="aviso"><strong>Cómo tratamos lo que nos cuentas.</strong> Tu voz se convierte en texto y el audio se descarta al instante: no se guarda. ' +
      'Antes de guardar, puedes leer y corregir el texto. La información se usa solo para el inventario de procesos y se borra al cierre del proyecto. ' +
      'Habla de cargos y áreas, no de personas, y no menciones datos reales de clientes o trabajadores.</p>' +
      (S.fuera_alcance ? '<p class="aviso" style="margin-top:10px"><strong>Compra de bienes y servicios.</strong> No incluyas el proceso de compra de bienes y servicios (los gastos): se levanta aparte con el equipo consultor, aunque tu área gestione compras. La compra de accesorios para vender a los clientes sí va.</p>' : '') +
      '<div class="enlace-box"><label for="miEnlace" style="margin:0">Tu enlace personal</label><input type="text" id="miEnlace" readonly value="' + esc(miEnlace()) + '">' +
      '<button class="btn btn-ghost btn-sm" type="button" id="btnCopiarEnlace">Copiar</button></div>';
    root.appendChild(intro);
    intro.querySelector('#btnCopiarEnlace').addEventListener('click', function(){
      var b = this;
      navigator.clipboard.writeText(miEnlace()).then(function(){ b.textContent = 'Copiado ✓'; setTimeout(function(){ b.textContent = 'Copiar'; }, 1600); });
    });

    // Parte 1: tus procesos del inventario (no se mueven al marcarlos: así nadie cree que se eliminaron).
    // Parte 2: buscar otros procesos (cambios de área) o agregar uno nuevo.
    var p1 = document.createElement('section');
    p1.className = 'card';
    p1.innerHTML = '<div class="paso"><span class="n">1</span><div><h2>Tus procesos</h2>' +
      '<p class="lead">Aquí están todos los procesos que tienes mapeados en el inventario anterior. Confirma tu relación con cada uno: los que marques como «Participo» pasan a la parte 3 para que nos cuentes cómo funcionan.</p>' +
      '<div id="listaRev"></div><p class="lead hidden" id="revVacio" style="margin-top:6px">No tienes procesos del inventario anterior asignados. Búscalos en la parte 2.</p>' +
      '<p class="sub-t hidden" id="elegidosT">Procesos que elegiste</p><ul class="lista-el hidden" id="listaElegidos"></ul></div></div>';
    root.appendChild(p1);
    var p1b = document.createElement('section');
    p1b.className = 'card';
    p1b.innerHTML = '<div class="paso"><span class="n">2</span><div><h2>¿Participas en otros procesos?</h2>' +
      '<p class="lead">Busca tus procesos u otros para saber dónde podrías participar por cambios organizacionales. También puedes escribir tu nombre y apellido para ver los procesos donde figuras en el inventario anterior.</p>' +
      '<div id="busP" class="bus-fijo"></div>' +
      '<div style="margin-top:14px"><button class="btn-link" type="button" id="btnAgregar">¿No encuentras tu proceso? Agrégalo como nuevo</button></div>' +
      '<div id="formNuevo" class="hidden" style="margin-top:12px;background:var(--panel);border-radius:12px;padding:14px 16px">' +
        '<label for="nvProceso">Nombre del proceso *</label><input type="text" id="nvProceso" maxlength="200" placeholder="Ej. Seguimiento de embarques">' +
        '<label for="nvArea">¿A qué sección o área pertenece el proceso? *</label><select id="nvArea"></select>' +
        '<label for="nvDesc">En una frase, ¿de qué se trata? (opcional)</label><input type="text" id="nvDesc" maxlength="300">' +
        '<div class="fila" style="margin-top:12px"><button class="btn btn-sm" type="button" id="btnGuardarNuevo">Agregar</button>' +
        '<button class="btn-link" type="button" id="btnCancelarNuevo">Cancelar</button><span class="estado" id="estNuevo"></span></div>' +
      '</div></div></div>';
    root.appendChild(p1b);

    var bus = crearBuscador({
      etiqueta: 'Busca un proceso o tu nombre', placeholder: 'Ej.: importación, facturación… o tu nombre y apellido',
      buscar: function(q){ return api('/r/buscar?k=' + encodeURIComponent(K) + '&q=' + encodeURIComponent(q)); },
      yaElegido: function(p){ var r = S.revisiones[p.id]; return p.elegido || !!(r && (r.estado === 'vigente' || r.estado === 'cambio')); },
      elegir: elegirPersonal,
      elegirVarios: elegirVariosPersonal,
      agregar: function(q){ abrirNuevo(q); }, textoAgregar: 'Agregarlo como proceso nuevo'
    });
    $('#busP').appendChild(bus.el);
    var selArea = $('#nvArea'), mia = S.encuestado.gerencia + '|' + S.encuestado.seccion, hayMia = false;
    selArea.innerHTML = (S.areas || []).map(function(a){
      return '<optgroup label="' + esc(a.gerencia) + '">' + a.secciones.map(function(sec){
        var v = a.gerencia + '|' + sec, sel = v === mia;
        hayMia = hayMia || sel;
        return '<option value="' + esc(v) + '"' + (sel ? ' selected' : '') + '>' + esc(sec) + '</option>';
      }).join('') + '</optgroup>';
    }).join('');
    // Si la sección de la persona no figura en el inventario, se ofrece igualmente como primera opción.
    if (!hayMia) selArea.insertAdjacentHTML('afterbegin', '<option value="' + esc(mia) + '" selected>' + esc(S.encuestado.seccion) + '</option>');

    // Paso 2: respuestas
    var p2 = document.createElement('section');
    p2.innerHTML = '<div class="card" style="margin-bottom:14px"><div class="paso"><span class="n">3</span><div><h2>Cuéntanos cómo funciona cada proceso</h2>' +
      '<p class="lead" style="margin:0 0 6px">Abre cada proceso y responde sus 3 bloques:</p>' +
      '<ul class="guia">' +
        '<li>Cada bloque trae la lista de lo que necesitamos saber.</li>' +
        '<li>Pulsa <strong>Grabar</strong> y cuéntalo como si se lo explicaras a un colega nuevo, o escríbelo.</li>' +
        '<li>También puedes <strong>subir una imagen</strong> (un flujo, un formato, una pantalla): la IA escribe lo que ve y la imagen no se guarda.</li>' +
        '<li>El texto aparece solo y lo puedes corregir. Al terminar revisamos tu respuesta y marcamos lo que ya cubriste.</li>' +
        '<li>Lo que no exista en tu proceso (por ejemplo, si no hay indicadores) márcalo como «No aplica».</li>' +
        '<li>Un proceso queda <strong>completo</strong> cuando todos sus puntos están marcados.</li>' +
      '</ul></div></div></div>' +
      '<div id="listaProc" style="display:flex;flex-direction:column;gap:12px"></div>';
    root.appendChild(p2);

    // Fin
    var fin = document.createElement('section');
    fin.className = 'card';
    fin.innerHTML = '<h2>¿Terminaste?</h2><p class="lead">Tus respuestas ya están guardadas. Avísanos que terminaste para preparar la reunión de validación. Puedes volver a editar después.</p>' +
      '<button class="btn" type="button" id="btnEnviar">Marcar como terminado</button><div class="msg ok hidden" id="msgFin" style="margin-top:12px"></div>';
    root.appendChild(fin);

    pintarPaso1();
    pintarProcesos();
    if (S.encuestado.estado === 'enviado') mostrarFin('Ya marcaste la encuesta como terminada. Si cambias algo, se guarda igual.');

    $('#btnAgregar').addEventListener('click', function(){ abrirNuevo(''); });
    $('#btnCancelarNuevo').addEventListener('click', function(){ $('#formNuevo').classList.add('hidden'); });
    $('#btnGuardarNuevo').addEventListener('click', agregarProceso);
    $('#btnEnviar').addEventListener('click', function(){
      var inc = procesosActivos().filter(function(p){ return !procesoCompleto(p.id); });
      if (inc.length && !confirm('Te ' + (inc.length === 1 ? 'falta completar 1 proceso' : 'faltan completar ' + inc.length + ' procesos') + ': ' +
        inc.slice(0, 5).map(nombreProc).join(', ') + (inc.length > 5 ? '…' : '') + '.\n\n¿Marcar la encuesta como terminada igual?')) return;
      var b = this; b.disabled = true;
      api('/r/enviar', {}).then(function(){ mostrarFin('¡Gracias! Avisamos al equipo consultor. Te contactarán para una reunión corta de validación.'); })
        .catch(function(err){ mostrarFin(err.message, true); }).then(function(){ b.disabled = false; });
    });
    $('#barra').classList.remove('hidden');
    actualizarAvance();
    ajustarBuscadorFijo();   // directo, sin esperar al siguiente cuadro: la barra acaba de mostrarse
    if (nuevo !== null) abrirNuevo(nuevo);
  }

  function mostrarFin(t, error){ var m = $('#msgFin'); m.textContent = t; m.className = 'msg ' + (error ? 'warn' : 'ok'); }

  function abrirNuevo(q){
    $('#formNuevo').classList.remove('hidden');
    if (q) $('#nvProceso').value = q;
    $('#formNuevo').scrollIntoView({behavior:'smooth', block:'center'});
    setTimeout(function(){ $('#nvProceso').focus({preventScroll:true}); }, 250);
  }

  function pintarPaso1(){
    var ul = $('#listaElegidos');
    ul.innerHTML = '';
    // Procesos que la persona buscó y eligió (no vienen de su sección ni se los asignaron).
    var el = S.procesos.filter(function(p){ return !p.enSeccion && !p.asignado && (p.elegido || p.propio); });
    el.forEach(function(p){ ul.appendChild(filaElegido(p)); });
    ul.classList.toggle('hidden', !el.length);
    $('#elegidosT').classList.toggle('hidden', !el.length);
    // Los de su sección o asignados se confirman uno por uno y se quedan en su lugar. Solo se agregan las filas que faltan:
    // las existentes conservan lo que la persona está escribiendo.
    var todos = S.procesos.filter(function(p){ return p.enSeccion || p.asignado; }), cont = $('#listaRev');
    todos.forEach(function(p){ if (!document.getElementById('rev-' + p.id)) cont.appendChild(tarjetaRevision(p)); });
    $('#revVacio').classList.toggle('hidden', !!todos.length);
  }

  // El buscador fijo se pega bajo la barra de avance (si está visible); la sombra aparece solo cuando está pegado.
  function ajustarBuscadorFijo(){
    var b = $('#barra');
    document.documentElement.style.setProperty('--barra-h', (b && !b.classList.contains('hidden') ? b.offsetHeight : 0) + 'px');
    Array.prototype.forEach.call(document.querySelectorAll('.bus-fijo'), function(f){
      var top = parseFloat(getComputedStyle(f).top) || 0;
      f.classList.toggle('pegado', f.getBoundingClientRect().top <= top + 1 && window.scrollY > 0);
    });
  }
  var rafFijo = 0;
  function programarFijo(){ if (!rafFijo) rafFijo = requestAnimationFrame(function(){ rafFijo = 0; ajustarBuscadorFijo(); }); }
  window.addEventListener('scroll', programarFijo, {passive: true});
  window.addEventListener('resize', programarFijo);

  function filaElegido(p){
    var li = document.createElement('li');
    var area = (p.gerencia !== S.encuestado.gerencia || p.seccion !== S.encuestado.seccion) ? areaProc(p) : '';
    li.innerHTML = '<div class="txt"><div class="proc-nombre">' + esc(nombreProc(p)) + (p.propio ? '<span class="tag">Agregado por ti</span>' : '') + '</div>' +
      '<div class="proc-ruta">' + esc([area, rutaProc(p)].filter(Boolean).join(' › ') || (p.codigo || '')) + '</div></div>' +
      '<span class="avance" data-avance="' + esc(p.id) + '"></span>' +
      '<button type="button" class="btn-link">Quitar</button>';
    li.querySelector('button').addEventListener('click', function(){ soltar(p); });
    return li;
  }

  // Procesos que la persona eligió (uno o varios): quedan como "participo" y listos para responder.
  function aplicarElegidos(lista){
    lista.forEach(function(q){
      var ya = S.procesos.filter(function(x){ return x.id === q.id; })[0];
      if (ya) Object.assign(ya, q); else S.procesos.push(q);
      var r = S.revisiones[q.id];
      if (!r || (r.estado !== 'vigente' && r.estado !== 'cambio')) S.revisiones[q.id] = {estado:'vigente', comentario: r ? r.comentario : ''};
    });
    pintarPaso1();
    lista.forEach(function(q){ marcarRevision(q.id); });
    pintarProcesos();
  }
  function elegirPersonal(p){
    return api('/r/elegir', {proceso_id: p.id}).then(function(j){ aplicarElegidos(j.procesos || [j.proceso]); });
  }
  function elegirVariosPersonal(ps){
    return api('/r/elegir', {proceso_ids: ps.map(function(p){ return p.id; })}).then(function(j){ aplicarElegidos(j.procesos || [j.proceso]); });
  }

  function soltar(p){
    if (ocupado(p.id)){ alert('Espera a que termine la grabación de este proceso.'); return; }
    var tiene = Object.keys(S.respuestas[p.id] || {}).some(function(q){ return respondida(p.id, q); });
    if (!confirm('¿Quitar «' + nombreProc(p) + '» de tu lista?' + (tiene ? ' También se borrarán tus respuestas sobre este proceso.' : ''))) return;
    api('/r/soltar', {proceso_id: p.id}).then(function(){
      S.procesos = S.procesos.filter(function(x){ return x.id !== p.id || x.enSeccion; });
      delete S.revisiones[p.id]; delete S.respuestas[p.id];
      pintarPaso1();
      pintarProcesos();
    }).catch(function(err){ alert(err.message); });
  }

  function tarjetaRevision(p){
    var d = document.createElement('div');
    d.className = 'proc-rev';
    d.id = 'rev-' + p.id;
    var r = S.revisiones[p.id] || {};
    var ruta = rutaProc(p), area = p.enSeccion ? '' : areaProc(p);
    d.innerHTML = '<div class="proc-nombre">' + esc(nombreProc(p)) + (p.asignado && ORIGEN_ASIG[p.asignado] && !p.enSeccion ? '<span class="tag">' + esc(ORIGEN_ASIG[p.asignado]) + '</span>' : '') +
        ' <span class="avance" data-avance="' + esc(p.id) + '"></span></div>' +
      (ruta || p.codigo || area ? '<div class="proc-ruta">' + esc([area, p.codigo, ruta].filter(Boolean).join(' · ')) + '</div>' : '<div style="height:8px"></div>') +
      '<div class="pillbox" role="radiogroup" aria-label="Tu relación con este proceso">' +
        ESTADOS.map(function(o){
          return '<label class="pill"><input type="radio" name="rv-' + esc(p.id) + '" value="' + o[0] + '"' + (r.estado === o[0] ? ' checked' : '') + '><span>' + o[1] + '</span></label>';
        }).join('') + '</div>' +
      '<div class="' + (r.estado === 'cambio' || r.estado === 'no_existe' ? '' : 'hidden') + '" id="cm-' + esc(p.id) + '">' +
        '<label for="cmt-' + esc(p.id) + '">¿Qué cambió o por qué ya no se hace?</label>' +
        '<input type="text" id="cmt-' + esc(p.id) + '" maxlength="600" value="' + esc(r.comentario || '') + '"></div>' +
      '<div class="estado" id="rest-' + esc(p.id) + '"></div>';
    d.addEventListener('change', function(ev){ if (ev.target.name === 'rv-' + p.id) guardarRevision(p); });
    d.querySelector('#cmt-' + CSS.escape(p.id)).addEventListener('change', function(){ guardarRevision(p); });
    return d;
  }

  // Refleja en la fila de la sección un estado que cambió por otra vía (por ejemplo, elegirlo en el buscador).
  function marcarRevision(pid){
    var r = S.revisiones[pid] || {};
    var inp = document.querySelector('input[name="rv-' + CSS.escape(pid) + '"][value="' + r.estado + '"]');
    if (inp) inp.checked = true;
    var caja = document.getElementById('cm-' + pid);
    if (caja) caja.classList.toggle('hidden', !(r.estado === 'cambio' || r.estado === 'no_existe'));
  }

  function guardarRevision(p){
    var sel = document.querySelector('input[name="rv-' + CSS.escape(p.id) + '"]:checked');
    if (!sel) return;
    var cm = document.getElementById('cmt-' + p.id);
    document.getElementById('cm-' + p.id).classList.toggle('hidden', !(sel.value === 'cambio' || sel.value === 'no_existe'));
    var est = document.getElementById('rest-' + p.id);
    est.className = 'estado'; est.textContent = 'Guardando…';
    api('/r/revision', {proceso_id: p.id, estado: sel.value, comentario: cm ? cm.value : ''}).then(function(){
      S.revisiones[p.id] = {estado: sel.value, comentario: cm ? cm.value : ''};
      est.className = 'estado ok'; est.textContent = 'Guardado';
      pintarPaso1();
      pintarProcesos();
    }).catch(function(err){ est.className = 'estado warn'; est.textContent = err.message; });
  }

  function agregarProceso(){
    var nombre = $('#nvProceso').value.trim();
    var est = $('#estNuevo');
    if (!nombre){ est.className = 'estado warn'; est.textContent = 'Escribe el nombre del proceso.'; return; }
    est.className = 'estado'; est.textContent = 'Guardando…';
    var area = ($('#nvArea').value || '').split('|');
    api('/r/proceso', {proceso: nombre, gerencia: area[0] || undefined, seccion: area.slice(1).join('|') || undefined, descripcion: $('#nvDesc').value}).then(function(j){
      S.procesos.push(j.proceso);
      S.revisiones[j.proceso.id] = {estado:'vigente', comentario:''};
      $('#nvProceso').value = ''; $('#nvDesc').value = '';
      $('#formNuevo').classList.add('hidden');
      est.textContent = '';
      pintarPaso1();
      pintarProcesos();
    }).catch(function(err){ est.className = 'estado warn'; est.textContent = err.message; });
  }

  // Procesos que se responden: los que la persona marcó como propios (participa), sean de su sección, elegidos o nuevos.
  function procesosActivos(){
    return S.procesos.filter(function(p){
      var r = S.revisiones[p.id];
      return r && (r.estado === 'vigente' || r.estado === 'cambio');
    });
  }

  function pintarProcesos(){
    var lista = $('#listaProc');
    var activos = procesosActivos();
    var ids = activos.map(function(p){ return p.id; });
    // Se quitan las tarjetas de procesos que dejaron de estar activos (salvo si se está grabando en ellas).
    Array.prototype.slice.call(lista.children).forEach(function(el){
      if (el.dataset.id && ids.indexOf(el.dataset.id) < 0 && !ocupado(el.dataset.id)) el.remove();
    });
    var vacio = $('#procVacio'); if (vacio) vacio.remove();
    activos.forEach(function(p){
      var el = document.getElementById('pr-' + p.id) || tarjetaProceso(p);
      lista.appendChild(el);   // appendChild de un nodo existente solo lo reordena, conserva su estado
    });
    if (!activos.length){
      var c = document.createElement('div');
      c.className = 'card'; c.id = 'procVacio'; c.style.color = 'var(--muted)';
      c.textContent = 'Cuando elijas en el paso 1 los procesos en los que participas, aparecerán aquí para que nos cuentes cómo funcionan.';
      lista.appendChild(c);
    }
    actualizarAvance();
  }

  function respuesta(pid, q){ return ((S.respuestas[pid] || {})[q]) || {texto:'', sistemas:[], checklist:{}}; }
  function respondida(pid, q){ var r = respuesta(pid, q); return !!(r.texto && r.texto.trim()) || (r.sistemas && r.sistemas.length > 0); }
  function bloque(bid){ return BLOQUES.filter(function(b){ return b.id === bid; })[0]; }

  // Checklist: un punto está listo si quedó cubierto o si no aplica al proceso. Un proceso está completo
  // cuando todos los puntos de sus 3 bloques están listos.
  function puntoListo(ck, id){ var x = ck && ck[id]; return !!x && (x.estado === 'cubierto' || x.estado === 'no_aplica'); }
  function listosBloque(pid, b){ var ck = respuesta(pid, b.id).checklist || {}; return b.puntos.filter(function(pt){ return puntoListo(ck, pt[0]); }).length; }
  function totalPuntos(){ return BLOQUES.reduce(function(a, b){ return a + b.puntos.length; }, 0); }
  function listosProceso(pid){ return BLOQUES.reduce(function(a, b){ return a + listosBloque(pid, b); }, 0); }
  function procesoCompleto(pid){ return !!BLOQUES.length && listosProceso(pid) === totalPuntos(); }

  function tarjetaProceso(p){
    var d = document.createElement('details');
    d.className = 'proc';
    d.id = 'pr-' + p.id;
    d.dataset.id = p.id;
    var area = (p.gerencia !== S.encuestado.gerencia || p.seccion !== S.encuestado.seccion) ? areaProc(p) : '';
    var ruta = [area, rutaProc(p)].filter(Boolean).join(' › ');
    var html = '<summary><div class="sum-txt"><div class="proc-nombre">' + esc(nombreProc(p)) + '</div>' +
      (ruta ? '<div class="proc-ruta" style="margin:2px 0 0">' + esc(ruta) + '</div>' : '') + '</div>' +
      '<span class="avance" data-avance="' + esc(p.id) + '"></span>' +
      '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>';
    // Respuestas en el formato anterior (6 preguntas): quedan a la vista como base para los bloques.
    var previas = Object.keys(PREG_ANTES).filter(function(q){ return respondida(p.id, q); });
    if (previas.length) html += '<details class="previas"><summary>Lo que ya nos contaste antes (' + previas.length + (previas.length === 1 ? ' respuesta' : ' respuestas') + ')</summary>' +
      previas.map(function(q){ var r = respuesta(p.id, q); return '<p><b>' + esc(PREG_ANTES[q]) + ':</b> ' + esc(r.texto) + (r.sistemas.length ? ' · Sistemas: ' + esc(r.sistemas.join(', ')) : '') + '</p>'; }).join('') +
      '<p class="preg-g" style="margin:8px 0 0">Úsalo como base: cópialo en el bloque que corresponda o vuelve a grabarlo.</p></details>';
    BLOQUES.forEach(function(q, i){
      var r = respuesta(p.id, q.id);
      var key = p.id + '-' + q.id;
      html += '<div class="preg">' +
        '<div class="preg-t"><span class="qn">' + (i+1) + '</span><span>' + esc(q.t) + '</span></div>' +
        '<p class="preg-g">' + esc(q.g) + '</p>' +
        '<p class="ck-t" id="ckt-' + esc(key) + '">Lo que necesitamos saber</p>' +
        '<ul class="ck" id="ck-' + esc(key) + '" aria-labelledby="ckt-' + esc(key) + '"></ul>' +
        '<div class="rec-row">' +
          '<button class="btn btn-rec btn-sm btn-ico" type="button" data-rec="' + esc(key) + '"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="11" rx="3" fill="currentColor" stroke="none"></rect><path d="M5 10.5a7 7 0 0 0 14 0M12 17.5V21"></path></svg><span>Grabar</span></button>' +
          '<button class="btn btn-ghost btn-sm btn-ico" type="button" data-img="' + esc(key) + '"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg><span>Subir imagen</span></button>' +
          '<input type="file" accept="image/*" class="hidden" id="im-' + esc(key) + '" aria-label="Subir una imagen para el bloque ' + (i+1) + '">' +
          '<span class="rec-dot hidden" id="dot-' + esc(key) + '" aria-hidden="true"></span>' +
          '<span class="rec-timer hidden" id="tm-' + esc(key) + '">0:00</span>' +
          '<span class="estado" id="st-' + esc(key) + '" aria-live="polite"></span>' +
        '</div>' +
        '<textarea id="tx-' + esc(key) + '" maxlength="12000" aria-label="Respuesta al bloque ' + (i+1) + '" placeholder="Pulsa Grabar y habla, escribe aquí o sube una imagen…">' + esc(r.texto) + '</textarea>';
      if (q.sistemas){
        // El cuadro existe siempre (aunque la campaña no tenga catálogo): los sistemas que la IA detecta en lo que cuentas aparecen aquí marcados.
        html += '<div id="sbox-' + esc(key) + '"' + (S.sistemas.length ? '' : ' class="hidden"') + '><div class="sis-t">Marca los sistemas y plataformas que usan en este proceso (también los de otras empresas)</div>' +
          '<div class="pillbox" data-pills="' + esc(key) + '">' + S.sistemas.map(function(s){ return pastillaSistema(key, s, (r.sistemas || []).indexOf(s.nombre) >= 0); }).join('') + '</div>' +
          '<p class="estado ok hidden" id="sd-' + esc(key) + '" aria-live="polite" style="margin:8px 0 0"></p>' +
          '<p class="preg-g" style="margin:8px 0 0">Si mencionas un sistema al contarlo, lo marcamos solos; incluye las plataformas de otras empresas (Toyota Brasil, Quinto, portal SUNAT). Si marcamos uno que no es, desmárcalo.</p></div>';
      }
      html += '<p class="sug hidden" id="sg-' + esc(key) + '"></p>' +
        '<div class="fila" style="margin-top:8px;gap:10px"><button type="button" class="btn-link" data-verif="' + esc(key) + '">Revisar mi respuesta</button>' +
        '<span class="estado" id="vs-' + esc(key) + '" aria-live="polite"></span></div></div>';
    });
    d.innerHTML = html;
    BLOQUES.forEach(function(q){
      var key = p.id + '-' + q.id;
      var ta = d.querySelector('#tx-' + CSS.escape(key));
      ta.addEventListener('input', function(){ programarGuardado(p.id, q.id); });
      // Al salir del texto se revisa qué puntos cubrió (solo si cambió desde la última revisión).
      ta.addEventListener('blur', function(){ if (porRevisar[key]) verificar(p.id, q.id); });
      d.querySelector('[data-rec="' + CSS.escape(key) + '"]').addEventListener('click', function(){ alternarGrabacion(p.id, q.id); });
      var inImg = d.querySelector('#im-' + CSS.escape(key));
      d.querySelector('[data-img="' + CSS.escape(key) + '"]').addEventListener('click', function(){ if (!grab[key]) inImg.click(); });
      inImg.addEventListener('change', function(){ var fi = inImg.files && inImg.files[0]; inImg.value = ''; leerImagen(p.id, q.id, fi); });
      d.querySelector('[data-verif="' + CSS.escape(key) + '"]').addEventListener('click', function(){ verificar(p.id, q.id, true); });
      var cajaPill = d.querySelector('[data-pills="' + CSS.escape(key) + '"]');
      if (cajaPill) cajaPill.addEventListener('change', function(ev){
        if (!ev.target.matches('[data-sis]')) return;
        recordarRechazo(p.id, q.id, ev.target);
        programarGuardado(p.id, q.id, 0); programarRevision(p.id, q.id, 4000);
      });
      d.querySelector('#ck-' + CSS.escape(key)).addEventListener('click', function(ev){
        var bt = ev.target.closest('[data-punto]');
        if (bt) marcarPunto(p.id, q.id, bt.dataset.punto, bt.dataset.estado, bt);
      });
      pintarChecklist(p.id, q.id, d);
    });
    // Bloques respondidos que nunca se revisaron (p. ej. escritos antes de cerrar la página): se revisan al abrir el proceso.
    d.addEventListener('toggle', function(){ if (d.open) revisarPendientes(p.id); });
    pintarAvanceProc(p.id, d);
    return d;
  }

  // ------------------------------------------------------------ sistemas detectados por la IA
  function pastillaSistema(key, s, marcado){
    return '<label class="pill"><input type="checkbox" data-sis="' + esc(key) + '" value="' + esc(s.nombre) + '"' + (marcado ? ' checked' : '') + '><span>' + esc(s.nombre) +
      (s.tipo === 'detectado' ? '<small class="det">detectado</small>' : '') + '</span></label>';
  }
  // Si la persona desmarca un sistema que la IA había detectado, queda anotado para no volver a marcarlo; si lo vuelve a marcar, se quita de la lista.
  function recordarRechazo(pid, bid, input){
    var r = respuesta(pid, bid);
    if (!S.respuestas[pid] || !S.respuestas[pid][bid]) (S.respuestas[pid] = S.respuestas[pid] || {})[bid] = r;
    var ck = r.checklist = r.checklist || {};
    var rech = (ck._sistemas_rechazados || []).filter(function(n){ return sinTildes(n) !== sinTildes(input.value); });
    var detectado = (ck._sistemas_ia || []).some(function(n){ return sinTildes(n) === sinTildes(input.value); });
    if (!input.checked && detectado) rech.push(input.value);
    ck._sistemas_rechazados = rech;
  }
  // Refleja lo que devolvió la revisión: pastillas nuevas para los sistemas que no estaban en el catálogo y marcadas las detectadas.
  function aplicarSistemas(pid, bid, lista, nuevos){
    var key = pid + '-' + bid;
    (nuevos || []).forEach(function(n){
      if (S.sistemas.some(function(s){ return sinTildes(s.nombre) === sinTildes(n); })) return;
      var s = {nombre: n, tipo: 'detectado'};
      S.sistemas.push(s);
      Array.prototype.forEach.call(document.querySelectorAll('[data-pills]'), function(caja){
        caja.insertAdjacentHTML('beforeend', pastillaSistema(caja.getAttribute('data-pills'), s, false));
      });
    });
    var caja = document.getElementById('sbox-' + key);
    if (caja) caja.classList.toggle('hidden', !S.sistemas.length);
    Array.prototype.forEach.call(document.querySelectorAll('[data-sis="' + CSS.escape(key) + '"]'), function(c){
      c.checked = (lista || []).some(function(n){ return sinTildes(n) === sinTildes(c.value); });
    });
  }
  function pintarNotaSistemas(pid, bid, root){
    var key = pid + '-' + bid, nota = (root || document).querySelector('#sd-' + CSS.escape(key));
    if (!nota) return;
    var r = respuesta(pid, bid), ck = r.checklist || {};
    var marcados = (ck._sistemas_ia || []).filter(function(n){
      return (r.sistemas || []).some(function(x){ return sinTildes(x) === sinTildes(n); });
    });
    nota.textContent = marcados.length ? 'Detectamos en lo que contaste y marcamos: ' + marcados.join(', ') + '.' : '';
    nota.classList.toggle('hidden', !marcados.length);
  }

  // Lista de puntos del bloque con su estado y los botones para marcar a mano "Lo mencioné" o "No aplica".
  function pintarChecklist(pid, bid, root){
    var key = pid + '-' + bid, b = bloque(bid);
    var ul = (root || document).querySelector('#ck-' + CSS.escape(key));
    if (!ul || !b) return;
    var ck = respuesta(pid, bid).checklist || {}, hay = respondida(pid, bid), revisado = !!ck._huella;
    ul.innerHTML = b.puntos.map(function(pt){
      var x = ck[pt[0]] || null, persona = !!(x && x.fuente === 'persona');
      var est = x ? x.estado : (revisado ? 'falta' : 'pendiente');
      var nota = '';
      if (est === 'cubierto') nota = persona ? 'Marcaste que lo mencionaste' : (x.evidencia ? '«' + x.evidencia + '»' : '');
      else if (est === 'no_aplica') nota = persona ? 'Marcaste que no aplica a tu proceso' : 'Dijiste que no aplica' + (x.evidencia ? ': «' + x.evidencia + '»' : '');
      else if (est === 'falta') nota = 'Todavía no lo mencionas';
      var acc = '';
      if (persona) acc = '<button type="button" class="btn-mini" data-punto="' + esc(pt[0]) + '" data-estado="">Deshacer</button>';
      else if (est === 'falta' || est === 'pendiente'){
        // "No aplica" solo en lo que puede no existir (terceros, datos personales, indicadores…): el objetivo o los pasos hay que contarlos.
        acc = (hay ? '<button type="button" class="btn-mini" data-punto="' + esc(pt[0]) + '" data-estado="cubierto" aria-label="Lo mencioné: ' + esc(pt[1]) + '">Lo mencioné</button>' : '') +
          (pt[2] ? '<button type="button" class="btn-mini" data-punto="' + esc(pt[0]) + '" data-estado="no_aplica" aria-label="No aplica: ' + esc(pt[1]) + '">No aplica</button>' : '');
      }
      return '<li class="' + est + '"><span class="caja" aria-hidden="true">' + (est === 'cubierto' ? '✓' : est === 'no_aplica' ? '–' : '') + '</span>' +
        '<span class="t"><span class="sr">' + EST_TXT[est] + ': </span>' + esc(pt[1]) + (nota ? '<span class="nota">' + esc(nota) + '</span>' : '') + '</span>' +
        (acc ? '<span class="acc">' + acc + '</span>' : '') + '</li>';
    }).join('');
    var sg = (root || document).querySelector('#sg-' + CSS.escape(key));
    var faltan = b.puntos.filter(function(pt){ return !puntoListo(ck, pt[0]); }).length;
    if (sg){ sg.textContent = faltan && ck._sugerencia ? ck._sugerencia : ''; sg.classList.toggle('hidden', !(faltan && ck._sugerencia)); }
    if (b.sistemas) pintarNotaSistemas(pid, bid, root);
  }

  function ponerChecklist(pid, bid, ck, sistemas){
    var r = respuesta(pid, bid);
    (S.respuestas[pid] = S.respuestas[pid] || {})[bid] = {texto: r.texto, sistemas: sistemas || r.sistemas || [], checklist: ck || {}};
    pintarChecklist(pid, bid);
    actualizarAvance();
  }

  // ------------------------------------------------------------ revisión del checklist con IA
  var revisando = {}, repetir = {}, porRevisar = {}, timersRev = {};
  function estadoRev(key, t, cls){ var st = document.getElementById('vs-' + key); if (st){ st.className = 'estado' + (cls ? ' ' + cls : ''); st.textContent = t; } }
  function programarRevision(pid, bid, ms){
    var key = pid + '-' + bid;
    clearTimeout(timersRev[key]);
    timersRev[key] = setTimeout(function(){ verificar(pid, bid); }, ms);
  }
  function verificar(pid, bid, manual){
    var key = pid + '-' + bid;
    clearTimeout(timersRev[key]);
    if (grab[key]) return Promise.resolve();                  // se revisa al terminar la transcripción
    if (revisando[key]){ repetir[key] = true; return revisando[key]; }
    if (!manual && !sinGuardar[key] && !respondida(pid, bid)) return Promise.resolve();
    estadoRev(key, 'Revisando qué puntos cubriste…');
    var prom = (sinGuardar[key] ? guardar(pid, bid) : Promise.resolve()).then(function(){
      return api('/r/verificar', {proceso_id: pid, pregunta: bid});
    }).then(function(j){
      delete porRevisar[key];
      if (j.sistemas && !sinGuardar[key]) aplicarSistemas(pid, bid, j.sistemas, j.sistemas_nuevos);   // si la persona cambió algo mientras tanto, no se pisa
      ponerChecklist(pid, bid, j.checklist, !sinGuardar[key] ? j.sistemas : null);
      var b = bloque(bid), ck = j.checklist || {};
      var faltan = b.puntos.filter(function(pt){ return !puntoListo(ck, pt[0]); }).length;
      estadoRev(key, faltan ? (faltan === 1 ? 'Falta 1 punto de este bloque.' : 'Faltan ' + faltan + ' puntos de este bloque.') : '✓ Bloque completo.', faltan ? 'warn' : 'ok');
    }).catch(function(err){
      estadoRev(key, err.message, 'warn');
    }).then(function(){
      delete revisando[key];
      if (repetir[key]){ delete repetir[key]; return verificar(pid, bid); }
    });
    revisando[key] = prom;
    return prom;
  }
  function revisarPendientes(pid){
    BLOQUES.reduce(function(prom, b){
      var ck = respuesta(pid, b.id).checklist || {};
      // También se revisan los bloques cuyo checklist cambió (puntos nuevos sin marcar).
      if (!respondida(pid, b.id) || (ck._huella && b.puntos.every(function(pt){ return ck[pt[0]]; }))) return prom;
      return prom.then(function(){ return verificar(pid, b.id); });
    }, Promise.resolve());
  }
  function marcarPunto(pid, bid, punto, est, boton){
    var key = pid + '-' + bid;
    if (boton) boton.disabled = true;
    api('/r/punto', {proceso_id: pid, pregunta: bid, punto: punto, estado: est}).then(function(j){
      ponerChecklist(pid, bid, j.checklist);
      if (!est && respondida(pid, bid)) verificar(pid, bid);   // al deshacer, la IA vuelve a mirar ese punto
    }).catch(function(err){ if (boton) boton.disabled = false; estadoRev(key, err.message, 'warn'); });
  }

  // Avance: "✓ Completo", "N de 15 puntos" o "Por responder". Se muestra en el paso 1 y en cada proceso.
  function textoAvance(pid){
    if (!BLOQUES.length) return {t:'', full:false};
    var n = listosProceso(pid), tot = totalPuntos();
    if (n === tot) return {t:'✓ Completo', full:true};
    var algo = n || BLOQUES.some(function(b){ return respondida(pid, b.id); });
    return {t: algo ? n + ' de ' + tot + ' puntos' : 'Por responder', full:false};
  }
  function pintarAvanceProc(pid, root){
    var r = S.revisiones[pid], activo = !!r && (r.estado === 'vigente' || r.estado === 'cambio');
    var a = activo ? textoAvance(pid) : {t:'', full:false};
    var sel = '[data-avance="' + CSS.escape(pid) + '"]';
    var els = Array.prototype.slice.call(document.querySelectorAll(sel));
    if (root) els = els.concat(Array.prototype.slice.call(root.querySelectorAll(sel)));
    els.forEach(function(el){ el.textContent = a.t; el.classList.toggle('full', a.full); });
  }

  function actualizarAvance(){
    var activos = procesosActivos(), tot = totalPuntos(), completos = 0, puntos = 0;
    activos.forEach(function(p){ var n = listosProceso(p.id); puntos += n; if (tot && n === tot) completos++; });
    S.procesos.forEach(function(p){ pintarAvanceProc(p.id); });
    var pendientesRev = S.procesos.filter(function(p){ return (p.enSeccion || p.asignado) && !S.revisiones[p.id]; }).length;
    $('#pfill').style.width = (activos.length && tot ? Math.round(puntos * 100 / (activos.length * tot)) : 0) + '%';
    $('#ptext').textContent = (pendientesRev ? pendientesRev + ' por marcar en la parte 1 · ' : '') + completos + ' de ' + activos.length +
      (activos.length === 1 ? ' proceso completo' : ' procesos completos');
  }

  // ------------------------------------------------------------ guardado
  var timers = {}, sinGuardar = {};
  function programarGuardado(pid, qid, espera){
    var key = pid + '-' + qid;
    sinGuardar[key] = true;
    porRevisar[key] = true;
    if (!grab[key]) estado(key, 'Sin guardar…');
    clearTimeout(timers[key]);
    timers[key] = setTimeout(function(){ guardar(pid, qid); }, espera === undefined ? 1200 : espera);
  }
  function guardar(pid, qid){
    var key = pid + '-' + qid;
    clearTimeout(timers[key]);
    var ta = document.getElementById('tx-' + key);
    if (!ta) return Promise.resolve();
    var texto = ta.value;
    var sistemas = Array.prototype.map.call(document.querySelectorAll('[data-sis="' + CSS.escape(key) + '"]:checked'), function(c){ return c.value; });
    var rech = (respuesta(pid, qid).checklist || {})._sistemas_rechazados;
    return api('/r/respuesta', {proceso_id: pid, pregunta: qid, texto: texto, sistemas: sistemas, sis_rechazados: rech}).then(function(){
      delete sinGuardar[key];
      var ant = respuesta(pid, qid);
      (S.respuestas[pid] = S.respuestas[pid] || {})[qid] = {texto: texto, sistemas: sistemas, checklist: ant.checklist || {}};
      if (!grab[key]) estado(key, 'Guardado', 'ok');
      pintarChecklist(pid, qid);
      actualizarAvance();
    }).catch(function(err){
      estado(key, 'No se guardó: ' + err.message + '. Vuelve a escribir para reintentar.', 'warn');
    });
  }
  window.addEventListener('beforeunload', function(ev){
    if (Object.keys(sinGuardar).length || Object.keys(grab).length || Object.keys(fallidos).length){ ev.preventDefault(); ev.returnValue = ''; }
  });

  // ------------------------------------------------------------ grabación y transcripción
  var grab = {};   // key -> {pid, qid, rec, stream, chunks, secs, timer, fase}
  function ocupado(pid){ return Object.keys(grab).some(function(k){ return k.indexOf(pid + '-') === 0; }); }

  function alternarGrabacion(pid, qid){
    var key = pid + '-' + qid;
    if (grab[key] && grab[key].fase === 'grabando') return detener(key);
    if (grab[key]) return;   // transcribiendo
    iniciar(pid, qid);
  }

  function botonRec(key){ return document.querySelector('[data-rec="' + CSS.escape(key) + '"]'); }
  function estado(key, t, cls){ var st = document.getElementById('st-' + key); if (st){ st.className = 'estado' + (cls ? ' ' + cls : ''); st.textContent = t; } }

  function iniciar(pid, qid){
    var key = pid + '-' + qid;
    delete fallidos[key];   // una grabación nueva reemplaza la que no se pudo convertir
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
      estado(key, 'Tu navegador no permite grabar: escribe tu respuesta.', 'warn'); return;
    }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      var mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '');
      var rec = mime ? new MediaRecorder(stream, {mimeType: mime}) : new MediaRecorder(stream);
      var g = grab[key] = {pid: pid, qid: qid, rec: rec, stream: stream, chunks: [], secs: 0, fase: 'grabando'};
      rec.addEventListener('dataavailable', function(ev){ if (ev.data && ev.data.size) g.chunks.push(ev.data); });
      rec.addEventListener('stop', function(){ alDetener(key); });
      rec.start(1000);
      g.timer = setInterval(function(){
        g.secs++;
        document.getElementById('tm-' + key).textContent = fmt(g.secs);
        if (g.secs >= MAX_SEG) detener(key);
      }, 1000);
      var b = botonRec(key);
      b.querySelector('span').textContent = 'Detener';
      b.style.background = 'var(--accent)';
      document.getElementById('dot-' + key).classList.remove('hidden');
      var tm = document.getElementById('tm-' + key); tm.textContent = '0:00'; tm.classList.remove('hidden');
      estado(key, 'Grabando… habla con calma. Pulsa Detener al terminar (máx. 10 min).');
    }).catch(function(){
      estado(key, 'No se pudo usar el micrófono. Revisa el permiso del navegador o escribe tu respuesta.', 'warn');
    });
  }

  function detener(key){
    var g = grab[key];
    if (!g) return;
    clearInterval(g.timer);
    try { if (g.rec.state !== 'inactive') g.rec.stop(); } catch(e){}
  }

  function restaurarBoton(key){
    var b = botonRec(key);
    if (b){ b.querySelector('span').textContent = 'Grabar'; b.style.background = ''; b.disabled = false; }
    var dot = document.getElementById('dot-' + key); if (dot) dot.classList.add('hidden');
    var tm = document.getElementById('tm-' + key); if (tm) tm.classList.add('hidden');
  }

  function alDetener(key){
    var g = grab[key];
    g.stream.getTracks().forEach(function(t){ t.stop(); });
    g.fase = 'transcribiendo';
    restaurarBoton(key);
    botonRec(key).disabled = true;
    var blob = new Blob(g.chunks, {type: g.rec.mimeType || 'audio/webm'});
    if (!blob.size || g.secs < 1){ delete grab[key]; restaurarBoton(key); estado(key, 'No se capturó audio. Intenta de nuevo.', 'warn'); return; }
    estado(key, 'Convirtiendo tu voz en texto…');
    tramosWav(blob).then(function(tramos){
      transcribir(key, {pid: g.pid, qid: g.qid, tramos: tramos, textos: [], desde: 0});
    }).catch(function(){
      delete grab[key];
      restaurarBoton(key);
      estado(key, 'Tu navegador no pudo procesar la grabación. Intenta de nuevo o escribe tu respuesta.', 'warn');
    });
  }

  // Envía los tramos en orden. Si uno falla (el servicio de transcripción a veces rechaza un audio válido), el audio
  // queda en la memoria del navegador —no se guarda en ningún servidor— y se ofrece reintentar sin volver a grabar.
  var fallidos = {};
  function enviarTramo(wav){
    var intento = function(){
      return fetch(API + '/r/transcribir?k=' + encodeURIComponent(K), {method:'POST', headers:{'content-type':'audio/wav'}, body: wav})
        .then(function(r){ return r.json().then(function(j){ if (!r.ok || !j.ok) throw new Error(j.error || 'Error ' + r.status); return j.texto || ''; }); });
    };
    return intento().catch(function(){ return new Promise(function(ok){ setTimeout(ok, 1500); }).then(intento); });
  }
  function transcribir(key, t){
    grab[key] = {pid: t.pid, qid: t.qid, fase: 'transcribiendo'};
    var b = botonRec(key); if (b) b.disabled = true;
    var cadena = Promise.resolve();
    t.tramos.forEach(function(wav, i){
      if (i < t.desde) return;
      cadena = cadena.then(function(){
        if (t.tramos.length > 1) estado(key, 'Convirtiendo tu voz en texto… (' + (i+1) + ' de ' + t.tramos.length + ')');
        return enviarTramo(wav).then(function(texto){ if (texto) t.textos.push(texto); t.desde = i + 1; });
      });
    });
    cadena.then(function(){
      delete grab[key];
      restaurarBoton(key);
      var texto = t.textos.join(' ');
      if (!texto){ estado(key, 'No se entendió el audio. Intenta de nuevo más cerca del micrófono o escribe.', 'warn'); return; }
      var ta = document.getElementById('tx-' + key);
      ta.value = (ta.value.trim() ? ta.value.trim() + '\n\n' : '') + texto;
      return guardar(t.pid, t.qid).then(function(){
        estado(key, 'Listo. Revisa el texto y corrige lo que haga falta (se guarda solo).', 'ok');
        verificar(t.pid, t.qid);
      });
    }).catch(function(){
      delete grab[key];
      restaurarBoton(key);
      fallidos[key] = t;
      var st = document.getElementById('st-' + key);
      if (!st) return;
      st.className = 'estado warn';
      st.textContent = 'No pudimos convertir tu voz en texto. Tu grabación no se perdió: ';
      var r = document.createElement('button');
      r.type = 'button'; r.className = 'btn-link'; r.textContent = 'Reintentar sin volver a grabar';
      r.addEventListener('click', function(){
        var f = fallidos[key]; if (!f) return;
        delete fallidos[key];
        estado(key, 'Convirtiendo tu voz en texto…');
        transcribir(key, f);
      });
      st.appendChild(r);
    });
  }

  // ------------------------------------------------------------ imagen
  // Una foto o captura (un flujo, un formato, una pantalla, una pizarra) se reduce en el navegador (máx. 1600 px, JPEG)
  // y la IA escribe lo que ve, útil para el bloque. La imagen no se guarda en ningún servidor: solo queda el texto,
  // que se agrega a la respuesta y la persona revisa, igual que la transcripción de voz.
  function botonImg(key){ return document.querySelector('[data-img="' + CSS.escape(key) + '"]'); }
  function leerImagen(pid, qid, file){
    var key = pid + '-' + qid;
    if (!file || grab[key]) return;
    if (!/^image\//.test(file.type)){ estado(key, 'Ese archivo no es una imagen: sube una foto o captura (JPG o PNG).', 'warn'); return; }
    grab[key] = {pid: pid, qid: qid, fase: 'imagen'};
    var b = botonImg(key), rec = botonRec(key);
    if (b) b.disabled = true; if (rec) rec.disabled = true;
    var fin = function(){ delete grab[key]; if (b) b.disabled = false; if (rec) rec.disabled = false; };
    estado(key, 'La IA está leyendo la imagen…');
    reducirImagen(file).then(function(jpg){
      return fetch(API + '/r/imagen?k=' + encodeURIComponent(K) + '&proceso_id=' + encodeURIComponent(pid) + '&pregunta=' + encodeURIComponent(qid),
        {method: 'POST', headers: {'content-type': 'image/jpeg'}, body: jpg})
        .then(function(r){ return r.json().then(function(j){ if (!r.ok || !j.ok) throw new Error(j.error || 'Error ' + r.status); return j; }); });
    }).then(function(j){
      fin();
      if (!j.texto){ estado(key, (j.motivo ? j.motivo + ' ' : '') + 'No encontramos información del proceso en esa imagen.', 'warn'); return; }
      var ta = document.getElementById('tx-' + key);
      ta.value = (ta.value.trim() ? ta.value.trim() + '\n\n' : '') + 'Según la imagen: ' + j.texto;
      return guardar(pid, qid).then(function(){
        estado(key, 'Listo. Revisa lo que la IA leyó de la imagen y corrige lo que haga falta (la imagen no se guardó).', 'ok');
        verificar(pid, qid);
      });
    }).catch(function(err){
      fin();
      estado(key, /^No pudimos/.test(err.message) ? err.message : 'No pudimos leer la imagen: ' + err.message, 'warn');
    });
  }
  function reducirImagen(file){
    return new Promise(function(ok, ko){
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){
        var f = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.naturalWidth * f)); c.height = Math.max(1, Math.round(img.naturalHeight * f));
        var x = c.getContext('2d');
        x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);   // fondo blanco para PNG transparentes
        x.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function(b){ if (b) ok(b); else ko(new Error('tu navegador no pudo convertirla; prueba con otra imagen')); }, 'image/jpeg', 0.85);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); ko(new Error('tu navegador no puede abrir ese formato; usa JPG o PNG')); };
      img.src = url;
    });
  }

  // Decodifica lo grabado, lo pasa a 16 kHz mono y lo corta en tramos WAV de 2 minutos.
  // Así la transcripción funciona igual con Chrome (webm), Safari (mp4) o Firefox (ogg).
  function tramosWav(blob){
    return blob.arrayBuffer().then(function(buf){
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx = new Ctx();
      return new Promise(function(ok, ko){ ctx.decodeAudioData(buf, ok, ko); }).then(function(audio){
        ctx.close();
        var off = new OfflineAudioContext(1, Math.ceil(audio.duration * 16000), 16000);
        var src = off.createBufferSource();
        src.buffer = audio; src.connect(off.destination); src.start(0);
        return off.startRendering();
      });
    }).then(function(r){
      var datos = r.getChannelData(0), tam = TRAMO_SEG * 16000, out = [];
      for (var i = 0; i < datos.length; i += tam) out.push(wav(datos.subarray(i, Math.min(i + tam, datos.length)), 16000));
      return out;
    });
  }
  function wav(muestras, hz){
    var b = new ArrayBuffer(44 + muestras.length * 2), v = new DataView(b);
    function s(o, t){ for (var i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); }
    s(0,'RIFF'); v.setUint32(4, 36 + muestras.length * 2, true); s(8,'WAVE'); s(12,'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, hz, true);
    v.setUint32(28, hz * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); s(36,'data'); v.setUint32(40, muestras.length * 2, true);
    for (var i = 0, o = 44; i < muestras.length; i++, o += 2){ var x = Math.max(-1, Math.min(1, muestras[i])); v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7FFF, true); }
    return new Blob([b], {type:'audio/wav'});
  }
})();
